- status: 202
  title: Accepted (asynchronous processing)
  description: >-
    Write operations are accepted for asynchronous processing; the final result
    is delivered via callback rather than in the response body.
- status: 403
  title: Forbidden
  description: >-
    The caller is not authorized for the requested resource/organization (e.g. a
    resend-callbacks request referencing an organization outside the partner's
    scope of access).
