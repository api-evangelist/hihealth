- status: 409
  title: Conflict
  description: >-
    The requested state transition is not allowed (e.g. cancelling an onboarding
    submission that is already in a terminal state).
  source_operation: https://partner.getpliant.com/reference/cancel-onboarding-submission.md
- status: 429
  title: Too Many Requests
  description: >-
    Rate limit exceeded (900 requests / 5 minutes per IP); the IP is temporarily
    blocked.
  source_operation: https://partner.getpliant.com/docs/pliant-api-guidelines.md
