name: hi.health

description: 'hi.health is a cashless, real-time claims and payments platform for the insurance industry, now operated as "hi.health by Pliant"
  after joining Pliant. It replaces legacy reimbursement models with instantly issued virtual and physical cards whose spend is programmatically
  controlled per policy, merchant, currency and country. Members pay nothing upfront: eligible claims are settled in real time at the point of
  care across health, home, travel, corporate and auto insurance lines, and structured transaction data is streamed back to insurers for dashboards,
  reconciliation and fraud prevention. The developer surface is Pliant''s PCI-DSS-certified Cards-as-a-Service (CaaS) and Pro API: OAuth2 client-credentials
  access, asynchronous callback/webhook events, and a full sandbox, which partners embed to issue and manage cards, cardholders, transactions,
  receipts, payments and external transfers.'

