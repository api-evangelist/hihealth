openapi: 3.2.0
info:
  contact:
    name: API Support
    email: support@getpliant.com
    url: https://www.getpliant.com
  title: Pliant Partner Card Limit Requests API
  description: Pliant Partner API
  version: 2.1.0
  license:
    name: MIT
    url: https://opensource.org/license/MIT
servers:
- url: https://partner-api.getpliant.com/api
  description: Pliant Production Server
- url: https://sandbox.partner-api.getpliant.com/api
  description: Pliant Sandbox Server
- url: https://pci-api.getpliant.com
  description: PCI Vault Production Server
- url: https://pci-sandbox.partner-api.getpliant.com
  description: PCI Vault Sandbox Server
security:
- bearerAuth: []
tags:
- name: Card Limit Requests
  description: This tag is for operations related to card limit requests
paths:
  /cards/limits/requests:
    get:
      summary: List Card Limit Requests
      description: Returns a list of card requests. You can use the `limit`, `page`, `sortBy` and `sortDirection` parameters to filter and sort the results.
      tags:
      - Card Limit Requests
      operationId: list-card-limit-requests
      parameters:
      - name: organizationId
        in: query
        required: true
        description: The unique identifier of the organization.
        schema:
          type: string
          format: uuid
      - name: cardAccountId
        in: query
        description: The unique identifier of the card account. Card limit requests keep the card account id they were created with. If a card account was superseded, query both the superseded id and its successor (`supersededBy`) to get a complete list across the switch.
        schema:
          type: string
          format: uuid
      - name: cardholderId
        in: query
        description: The unique identifier of the cardholder.
        schema:
          type: string
          format: uuid
      - name: cardId
        in: query
        description: The unique identifier of the card.
        schema:
          type: string
          format: uuid
      - name: status
        description: The status to filter by.
        in: query
        schema:
          type: string
          enum:
          - APPROVED
          - REJECTED
          - PENDING
          - CANCELED
      - name: limit
        in: query
        description: The maximum number of items to return per page. The default value if not provided is 100, the maximum allowed value is 1000.
        schema:
          type: integer
      - name: page
        in: query
        description: The page number to return, starting with 0, this counts up to the total number of pages. The total number of pages is determined by the total number of records divided by the limit.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The field to sort by.
        schema:
          type: string
          enum:
          - organizationId
          - status
          - cardholderId
          - createdAt
      - name: sortDirection
        in: query
        description: The direction to sort by.
        schema:
          type: string
          enum:
          - ASC
          - DESC
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CardLimitRequest'
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
    post:
      summary: Create Card Limit Request
      description: Create a card limit request for a specific card.
      tags:
      - Card Limit Requests
      operationId: create-card-limit-requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - cardId
                properties:
                  organizationId:
                    type: string
                    format: uuid
                  cardholderId:
                    type: string
                    format: uuid
                  cardId:
                    type: string
                    format: uuid
              - type: object
                required:
                - limit
                - limitRenewFrequency
                - transactionLimit
                - comment
                properties:
                  limit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  limitRenewFrequency:
                    type: string
                    enum:
                    - DAILY
                    - WEEKLY
                    - MONTHLY
                    - QUARTERLY
                    - ANNUAL
                    - TOTAL
                    description: '* `DAILY` - The card limit is renewed every day

                      * `WEEKLY` - The card limit is renewed every week

                      * `MONTHLY` - The card limit is renewed every calendar month

                      * `QUARTERLY` - The card limit is renewed every calendar quarter

                      * `ANNUAL` - The card limit is renewed every year

                      * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

                      '
                  transactionLimit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  comment:
                    type: string
                    minLength: 0
                    maxLength: 200
                  additionalLimits:
                    type:
                    - array
                    - 'null'
                    description: Optional additional limits being requested. Represents the desired state, not a diff.
                    items:
                      $ref: '#/paths/~1cards~1limits~1{cardId}/put/requestBody/content/application~1json/schema/allOf/1/properties/additionalLimits/items'
      responses:
        '202':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  cardLimitRequestId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /cards/limits/requests/subscription:
    post:
      summary: 'Callback: Add/Update'
      description: Subscribe to callbacks for this entity or change an existing callback.
      tags:
      - Card Limit Requests
      operationId: create-card-limit-request-subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackUrl:
                  type: string
                  format: uri
                  example: https://myserver.com/send/callback/here
                  description: The URL to send the callback to. Must be a valid and reachable URL. We do some basic validation to ensure the URL is syntactically correct and reachable for Pliant. Only HTTPS URLs are supported.
                eventTypes:
                  type: array
                  description: The event types to subscribe to.
                  items:
                    type: string
                    enum:
                    - CARD_LIMIT_REQUEST_CREATED
                    - CARD_LIMIT_REQUEST_APPROVED
                    - CARD_LIMIT_REQUEST_REJECTED
              required:
              - callbackUrl
              - eventTypes
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      callbacks:
        cardLimitRequestsUpdated:
          '{$request.body#/callbackUrl}':
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                $ref: '#/components/requestBodies/CardLimitRequestCallback'
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
        cardLimitRequestsApproved:
          '{$request.body#/callbackUrl}':
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                $ref: '#/components/requestBodies/CardLimitRequestCallbackApproved'
              responses:
                '200':
                  description: Ok
        cardLimitRequestsRejected:
          '{$request.body#/callbackUrl}':
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                $ref: '#/components/requestBodies/CardLimitRequestCallback'
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
    delete:
      summary: 'Callback: Remove'
      description: Remove a callback subscription for this entity.
      tags:
      - Card Limit Requests
      operationId: remove-card-limit-request-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventTypes:
                  type: array
                  description: The event types to unsubscribe from.
                  items:
                    type: string
                    enum:
                    - CARD_LIMIT_REQUEST_CREATED
                    - CARD_LIMIT_REQUEST_APPROVED
                    - CARD_LIMIT_REQUEST_REJECTED
              required:
              - eventTypes
      responses:
        '200':
          description: Ok
  /cards/limits/requests/{cardLimitRequestId}:
    get:
      summary: Card Limit Request Details
      description: 'Returns details on a single card limit request for a specific card.

        Requested additional limits are not returned here — observe applied state via `GET /api/cards/{cardId}` or the `CARD_LIMITS_CHANGED` callback.'
      tags:
      - Card Limit Requests
      operationId: get-card-limit-request-detail
      parameters:
      - name: cardLimitRequestId
        in: path
        description: The ID of the card limit request to get the details for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/CardLimitRequestDetail'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    delete:
      summary: Cancel Card Limit Request
      description: Cancel an existing card limit request for a specific card.
      tags:
      - Card Limit Requests
      operationId: delete-card-limit-requests
      parameters:
      - name: cardLimitRequestId
        required: true
        description: The unique identifier of the card limit request.
        in: path
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Ok
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /cards/limits/requests/{cardLimitRequestId}/approve:
    post:
      summary: Approve Card Limit Request
      description: Approve a card limit change request created by a cardholder for a specific card.
      tags:
      - Card Limit Requests
      operationId: approve-card-limit-requests
      parameters:
      - name: cardLimitRequestId
        in: path
        required: true
        description: The unique identifier of the card limit request.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                description: At least one approved limit field (approvedLimit, approvedTransactionLimit, approvedLimitRenewFrequency) must be provided.
                required:
                - approvedBy
                properties:
                  approvedBy:
                    type: string
                    format: uuid
                    description: The `cardholderId` of the user who approved the card limit request.
                  approvedTransactionLimit:
                    type: object
                    description: The approved transaction limit of the card. The transaction limit is the maximum amount that can be spent in a single transaction.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  approvedLimit:
                    type: object
                    description: The approved limit of the card. The limit is the maximum amount that can be spent with the card.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  approvedLimitRenewFrequency:
                    type: string
                    description: 'The frequency with which the card limit is renewed.

                      * `DAILY` - The card limit is renewed every day

                      * `WEEKLY` - The card limit is renewed every week

                      * `MONTHLY` - The card limit is renewed every calendar month

                      * `QUARTERLY` - The card limit is renewed every calendar quarter

                      * `ANNUAL` - The card limit is renewed every year

                      * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

                      '
                    enum:
                    - DAILY
                    - WEEKLY
                    - MONTHLY
                    - QUARTERLY
                    - ANNUAL
                    - TOTAL
      responses:
        '200':
          description: Ok
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /cards/limits/requests/{cardLimitRequestId}/reject:
    post:
      summary: Reject Card Limit Request
      description: Reject a card limit request for a specific cardholder for a specific card.
      tags:
      - Card Limit Requests
      operationId: reject-card-limit-requests
      parameters:
      - name: cardLimitRequestId
        in: path
        required: true
        description: The unique identifier of the card limit request.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - rejectedBy
                properties:
                  rejectedBy:
                    type: string
                    format: uuid
                    description: The `cardholderId` of the user who rejected the card limit request.
      responses:
        '202':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/CardLimitRequest'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
components:
  schemas:
    Error:
      type: object
      properties:
        errorCode:
          type: string
          description: The error code
        exceptionId:
          type: string
          format: uuid
          description: The id of the exception that was thrown
        message:
          type: string
          description: The cause of the error or further explanations on the error
    CardLimitRequestCallback:
      type: object
      required:
      - cardLimitRequestId
      - organizationId
      - cardholderId
      - cardId
      - status
      - createdAt
      - requestedLimit
      - requestedLimitRenewFrequency
      - requestedTransactionLimit
      - comment
      properties:
        cardLimitRequestId:
          type: string
          format: uuid
          description: The id of the card limit request.
        organizationId:
          type: string
          format: uuid
          description: The id of the organization.
        cardAccountId:
          type: string
          format: uuid
          description: The id of the card account.
        cardholderId:
          type: string
          format: uuid
          description: The id of the cardholder.
        cardId:
          type: string
          format: uuid
          description: The id of the card.
        status:
          type: string
          description: The status of the card limit request.
          enum:
          - APPROVED
          - REJECTED
          - PENDING
          - CANCELED
        createdAt:
          type: string
          description: The date and time when the card limit request was created.
          format: date-time
        requestedLimit:
          type: object
          description: The requested card limit.
          properties:
            value:
              type: number
              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
            currency:
              type: string
              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
        requestedLimitRenewFrequency:
          type: string
          description: 'The requested card limit renew frequency.

            * `DAILY` - The card limit is renewed every day

            * `WEEKLY` - The card limit is renewed every week

            * `MONTHLY` - The card limit is renewed every calendar month

            * `QUARTERLY` - The card limit is renewed every calendar quarter

            * `ANNUAL` - The card limit is renewed every year

            * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

            '
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - QUARTERLY
          - ANNUAL
          - TOTAL
        requestedTransactionLimit:
          type: object
          description: The requested transaction limit.
          properties:
            value:
              type: number
              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
            currency:
              type: string
              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
        comment:
          type: string
          description: The comment of the card limit request.
          minLength: 0
          maxLength: 200
    CardLimitRequestCallbackApproved:
      type: object
      required:
      - cardLimitRequestId
      - organizationId
      - cardholderId
      - cardId
      - status
      - createdAt
      - requestedLimit
      - requestedLimitRenewFrequency
      - requestedTransactionLimit
      - comment
      properties:
        cardLimitRequestId:
          type: string
          format: uuid
          description: The id of the card limit request.
        organizationId:
          type: string
          format: uuid
          description: The id of the organization.
        cardAccountId:
          type: string
          format: uuid
          description: The id of the card account.
        cardholderId:
          type: string
          format: uuid
          description: The id of the cardholder.
        cardId:
          type: string
          format: uuid
          description: The id of the card.
        status:
          type: string
          description: The status of the card limit request.
          enum:
          - APPROVED
          - REJECTED
          - PENDING
          - CANCELED
        createdAt:
          type: string
          description: The date and time when the card limit request was created.
          format: date-time
        requestedLimit:
          type: object
          description: The requested card limit.
          properties:
            value:
              type: number
              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
            currency:
              type: string
              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
        requestedLimitRenewFrequency:
          type: string
          description: 'The requested card limit renew frequency.

            * `DAILY` - The card limit is renewed every day

            * `WEEKLY` - The card limit is renewed every week

            * `MONTHLY` - The card limit is renewed every calendar month

            * `QUARTERLY` - The card limit is renewed every calendar quarter

            * `ANNUAL` - The card limit is renewed every year

            * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

            '
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - QUARTERLY
          - ANNUAL
          - TOTAL
        requestedTransactionLimit:
          type: object
          description: The requested transaction limit of the card.
          properties:
            value:
              type: number
              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
