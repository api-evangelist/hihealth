    OnboardingSubmissionCreateAndSubmitPayload:
      allOf:
      - type: object
        description: 'The complete onboarding submission. Send the full payload in a single request.


          Only three fields are mandatory. At least one authorized signatory whose `signingAuthority`

          is `SOLE` or `JOINT` must provide `person.names.firstName`, `person.names.surname` and

          `person.contact.email`. Every other field is optional, but any field that *is* provided is

          validated — see the operation description for the full rule list.


          The selected name fields must total at most 24 characters, excluding the space between them. If the legal name fields

          exceed that limit, a shorter pair can be provided via `person.names.firstNameCard` and `person.names.surnameCard`.


          Unknown keys are rejected. Do not send null values.

