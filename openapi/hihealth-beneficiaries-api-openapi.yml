    put:
      summary: Update Beneficiary Payment Detail
      description: 'Update an existing payment detail for a beneficiary. You can modify banking information including account details, currency, and bank country.


        This operation allows you to update the banking information required for transfers to the beneficiary.'
      tags:
      - Beneficiaries
      operationId: update-beneficiary-payment-detail
      parameters:
      - name: beneficiaryId
        in: path
        description: The unique identifier of the beneficiary.
        required: true
        schema:
          type: string
          format: uuid
      - name: paymentDetailId
        in: path
        description: The unique identifier of the payment detail to update.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bankCountry:
                  type: string
                  description: The country where the bank is located in ISO 3166-1 alpha-2 format (e.g., `DE` for Germany, `US` for United States).
                bankAccountCurrency:
                  type: string
                  description: 'The currency of the bank account in ISO 4217 format. For `EUR`, `SEK`, `DKK`, `AED`, `CZK`, `HUF`, `NOK`, `PLN`, `RON` accounts, `accountDetail` must include `iban` and `bic`.

                    '
                bankAccountType:
                  type:
                  - string
                  - 'null'
                  enum:
                  - LOCAL
                  - INTERNATIONAL
                  description: 'The type of bank account. The type can only be set when it makes sense in the `bankCountry` - currently only in `GB`. It will be ignored for other countries.


                    It can be one of the following values:

                    - `LOCAL`: A local bank account within the same country.

                    - `INTERNATIONAL`: An international bank account for cross-border transfers.

                    '
                accountDetail:
                  $ref: '#/components/schemas/AccountDetail'
              required:
              - bankCountry
              - bankAccountCurrency
              - accountDetail
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryPaymentDetail'
