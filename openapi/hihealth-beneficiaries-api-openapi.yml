openapi: 3.2.0
info:
  contact:
    name: API Support
    email: support@getpliant.com
    url: https://www.getpliant.com
  title: Pliant Partner Beneficiaries API
  description: Pliant Partner API
  version: 2.1.0
  license:
    name: MIT
    url: https://opensource.org/license/MIT
servers:
- url: https://partner-api.getpliant.com/api
  description: Pliant Production Server
- url: https://sandbox.partner-api.getpliant.com/api
  description: Pliant Sandbox Server
- url: https://pci-api.getpliant.com
  description: PCI Vault Production Server
- url: https://pci-sandbox.partner-api.getpliant.com
  description: PCI Vault Sandbox Server
security:
- bearerAuth: []
tags:
- name: Beneficiaries
  description: This tag is for operations related to beneficiaries
paths:
  /beneficiaries:
    get:
      summary: List Beneficiaries
      description: Query beneficiaries for a specific organization. Beneficiaries are entities that can receive external transfers from your organization.
      tags:
      - Beneficiaries
      operationId: get-beneficiaries
      parameters:
      - name: organizationId
        in: query
        description: The organization for which the beneficiaries are requested.
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Page number. Starts from '0'.
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        description: Client suggested limit to restrict the number of entries on a page.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Beneficiary'
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    post:
      summary: Create Beneficiary
      description: 'Create a new beneficiary for the specified organization.


        Beneficiaries are entities that can receive external transfers from your organization. You must provide the required address information and specify whether the beneficiary is a business or individual.'
      tags:
      - Beneficiaries
      operationId: create-beneficiary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationId:
                  type: string
                  format: uuid
                  description: The organization to which the beneficiary belongs.
                type:
                  type: string
                  enum:
                  - BUSINESS
                  - INDIVIDUAL
                  description: 'The type of the beneficiary. It can be one of the following values:

                    - `BUSINESS`: A business entity beneficiary.

                    - `INDIVIDUAL`: An individual person beneficiary.

                    '
                legalName:
                  type: string
                  description: The legal name of the beneficiary.
                displayName:
                  type: string
                  description: The display name of the beneficiary.
                email:
                  type: string
                  format: email
                  description: The email address of the beneficiary.
                street:
                  type: string
                  description: The street address of the beneficiary.
                postalCode:
                  type: string
                  description: The postal code of the beneficiary's address.
                city:
                  type: string
                  description: The city of the beneficiary's address.
                region:
                  type: string
                  description: The region or state of the beneficiary's address.
                country:
                  type: string
                  description: The country of the beneficiary's address in ISO 3166-1 alpha-2 format (e.g., `DE` for Germany, `US` for United States).
              required:
              - organizationId
              - type
              - legalName
              - street
              - postalCode
              - city
              - country
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /beneficiaries/subscription:
    post:
      summary: 'Callback: Add/Update'
      description: Subscribe to callbacks for this entity or change an existing callback.
      tags:
      - Beneficiaries
      operationId: create-beneficiary-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackUrl:
                  type: string
                  format: uri
                  example: https://myserver.com/send/callback/here
                  description: The URL to send the callback to. Must be a valid and reachable URL. We do some basic validation to ensure the URL is syntactically correct and reachable for Pliant. Only HTTPS URLs are supported.
                eventTypes:
                  type: array
                  description: The event types to subscribe to.
                  items:
                    type: string
                    enum:
                    - BENEFICIARY_CREATED
                    - BENEFICIARY_UPDATED
                    - BENEFICIARY_ACTIVATION_CHANGED
                    - BENEFICIARY_PAYMENT_DETAILS_CREATED
                    - BENEFICIARY_PAYMENT_DETAILS_UPDATED
              required:
              - callbackUrl
              - eventTypes
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      callbacks:
        beneficiaryCreated:
          '{$request.body#/callbackUrl}':
            description: Callback structure for beneficiary creation (BENEFICIARY_CREATED).
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                $ref: '#/components/requestBodies/BeneficiaryCreatedCallback'
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
        beneficiaryUpdated:
          '{$request.body#/callbackUrl}':
            description: Callback structure for beneficiary updates (BENEFICIARY_UPDATED).
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                $ref: '#/components/requestBodies/BeneficiaryUpdatedCallback'
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
        beneficiaryActivationChanged:
          '{$request.body#/callbackUrl}':
            description: Callback structure for beneficiary activation changes (BENEFICIARY_ACTIVATION_CHANGED).
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                $ref: '#/components/requestBodies/BeneficiaryActivationChangedCallback'
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
        beneficiaryPaymentDetailsCreated:
          '{$request.body#/callbackUrl}':
            description: Callback structure for beneficiary payment details creation (BENEFICIARY_PAYMENT_DETAILS_CREATED).
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                $ref: '#/components/requestBodies/BeneficiaryPaymentDetailsCreatedCallback'
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
        beneficiaryPaymentDetailsUpdated:
          '{$request.body#/callbackUrl}':
            description: Callback structure for beneficiary payment details updates (BENEFICIARY_PAYMENT_DETAILS_UPDATED).
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                $ref: '#/components/requestBodies/BeneficiaryPaymentDetailsUpdatedCallback'
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
    delete:
      summary: 'Callback: Remove'
      description: Remove a callback subscription for this entity.
      tags:
      - Beneficiaries
      operationId: remove-beneficiary-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventTypes:
                  type: array
                  description: The event types to unsubscribe from.
                  items:
                    type: string
                    enum:
                    - BENEFICIARY_CREATED
                    - BENEFICIARY_UPDATED
                    - BENEFICIARY_ACTIVATION_CHANGED
                    - BENEFICIARY_PAYMENT_DETAILS_CREATED
                    - BENEFICIARY_PAYMENT_DETAILS_UPDATED
              required:
              - eventTypes
      responses:
        '200':
          description: Ok
  /beneficiaries/{beneficiaryId}:
    get:
      summary: Get Beneficiary Details
      description: Get detailed information about a specific beneficiary.
      tags:
      - Beneficiaries
      operationId: get-beneficiary-details
      parameters:
      - name: beneficiaryId
        in: path
        description: The unique identifier of the beneficiary.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    put:
      summary: Update Beneficiary
      description: Update an existing beneficiary. You can modify the beneficiary's information including address details, contact information, and display name.
      tags:
      - Beneficiaries
      operationId: update-beneficiary
      parameters:
      - name: beneficiaryId
        in: path
        description: The unique identifier of the beneficiary.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - BUSINESS
                  - INDIVIDUAL
                  description: 'The type of the beneficiary. It can be one of the following values:

                    - `BUSINESS`: A business entity beneficiary.

                    - `INDIVIDUAL`: An individual person beneficiary.

                    '
                legalName:
                  type: string
                  description: The legal name of the beneficiary.
                displayName:
                  type: string
                  description: The display name of the beneficiary.
                email:
                  type: string
                  format: email
                  description: The email address of the beneficiary.
                street:
                  type: string
                  description: The street address of the beneficiary.
                postalCode:
                  type: string
                  description: The postal code of the beneficiary's address.
                city:
                  type: string
                  description: The city of the beneficiary's address.
                region:
                  type: string
                  description: The region or state of the beneficiary's address.
                country:
                  type: string
                  description: The country of the beneficiary's address in ISO 3166-1 alpha-2 format (e.g., `DE` for Germany, `US` for United States).
              required:
              - type
              - legalName
              - street
              - postalCode
              - city
              - country
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /beneficiaries/{beneficiaryId}/active:
    patch:
      summary: Update Beneficiary Activation Status
      description: Update the activation status of a beneficiary.
      tags:
      - Beneficiaries
      operationId: update-beneficiary-activation
      parameters:
      - name: beneficiaryId
        in: path
        description: The unique identifier of the beneficiary.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  description: Whether the beneficiary should be active or inactive.
              required:
              - active
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /beneficiaries/{beneficiaryId}/payment-details:
    get:
      summary: List Beneficiary Payment Details
      description: 'Get all payment details for a specific beneficiary.


        Payment details contain the banking information required to process transfers to the beneficiary. A beneficiary can have multiple payment details for different currencies or banking methods.'
      tags:
      - Beneficiaries
      operationId: get-beneficiary-payment-details
      parameters:
      - name: beneficiaryId
        in: path
        description: The unique identifier of the beneficiary.
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Page number. Starts from '0'.
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        description: Client suggested limit to restrict the number of entries on a page.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BeneficiaryPaymentDetail'
                    description: List of payment details for the beneficiary.
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    post:
      summary: Create Beneficiary Payment Detail
      description: 'Create a new payment detail for a beneficiary.


        Payment details contain the banking information required to process transfers to the beneficiary. You can create multiple payment details for different currencies or banking methods.'
      tags:
      - Beneficiaries
      operationId: create-beneficiary-payment-detail
      parameters:
      - name: beneficiaryId
        in: path
        description: The unique identifier of the beneficiary.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bankCountry:
                  type: string
                  description: The country where the bank is located in ISO 3166-1 alpha-2 format (e.g., `DE` for Germany, `US` for United States).
                bankAccountCurrency:
                  type: string
                  description: 'The currency of the bank account in ISO 4217 format. For `EUR`, `SEK`, `DKK`, `AED`, `CZK`, `HUF`, `NOK`, `PLN`, `RON` accounts, `accountDetail` must include `iban` and `bic`.

                    '
                bankAccountType:
                  type:
                  - string
                  - 'null'
                  enum:
                  - LOCAL
                  - INTERNATIONAL
                  description: 'The type of bank account. The type can only be set when it makes sense in the `bankCountry` - currently only in `GB`. It will be ignored for other countries.


                    It can be one of the following values:

                    - `LOCAL`: A local bank account within the same country.

                    - `INTERNATIONAL`: An international bank account for cross-border transfers.

                    '
                accountDetail:
                  $ref: '#/components/schemas/AccountDetail'
              required:
              - bankCountry
              - bankAccountCurrency
              - accountDetail
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryPaymentDetail'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /beneficiaries/{beneficiaryId}/payment-details/{paymentDetailId}:
    get:
      summary: Get Beneficiary Payment Detail
      description: 'Get detailed information about a specific payment detail for a beneficiary.


        Payment details contain the banking information required to process transfers to the beneficiary, including account numbers, bank codes, and currency information.'
      tags:
      - Beneficiaries
      operationId: get-beneficiary-payment-detail
      parameters:
      - name: beneficiaryId
        in: path
        description: The unique identifier of the beneficiary.
        required: true
        schema:
          type: string
          format: uuid
      - name: paymentDetailId
        in: path
        description: The unique identifier of the payment detail.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
