              - VENTURE_CAPITAL_PRIVATE_EQUITY
              - VETERINARY
              - WAREHOUSING
              - WHOLESALE
              - WINE_AND_SPIRITS
              - WIRELESS
              - WRITING_AND_EDITING
            yearlyRevenue:
              type: object
              description: Estimated yearly revenue.
              required:
              - value
              - currency
              properties:
                value:
                  type: integer
                  format: int64
                  description: Amount in minor units (cents).
                  example: 5000000
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                  description: ISO 4217 currency code.
                  example: EUR
            numberOfEmployees:
              type: integer
              description: Number of employees of the referred legal entity.
              example: 50
            plannedNumberOfCards:
              type: integer
              description: Estimated number of virtual and/or physical credit cards the referred legal entity will issue.
              example: 20
            paymentFrequency:
              type: string
              enum:
              - MONTHLY
              - BI-WEEKLY
              - WEEKLY
              - DAILY
              - PREFUNDED
              description: 'Desired payment frequency. Use `PREFUNDED` for prefunded account types.

                '
              example: MONTHLY
            expectedMonthlyTransactionVolume:
              type: object
              required:
              - value
              - currency
              properties:
                value:
                  type: integer
                  format: int64
                  description: Amount in minor units (cents).
                  example: 5000000
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                  description: ISO 4217 currency code.
                  example: EUR
            customerAcquisitionChannel:
              type: string
              enum:
              - OUTBOUND
              - INBOUND
              - REFERRAL
              - PARTNER
              - CAMPAIGN
              description: Channel through which the customer was acquired.
              example: INBOUND
            customerRelationshipLength:
              type: integer
              minimum: 0
              description: Length of the existing relationship with the customer, in months.
              example: 12
            contacts:
              type: array
              minItems: 1
              maxItems: 5
              description: List of contact persons for the lead (relevant for HubSpot). Maximum 5 contacts.
              items:
                type: object
                required:
                - firstName
                - lastName
                - email
                properties:
                  salutation:
                    type: string
                    enum:
                    - MRS
                    - MR
                    description: Salutation of the contact person.
                  firstName:
                    type: string
                    description: First name of the contact person.
                  lastName:
                    type: string
                    description: Last name of the contact person.
                  email:
                    type: string
                    format: email
                    description: Email address of the contact person.
                  phone:
                    type: string
                    description: Phone number of the contact person.
                  contactRole:
                    type: string
                    enum:
                    - CONTACT
                    - LEGAL_REP
                    default: CONTACT
                    description: 'Role of the person within the legal entity.

                      - `LEGAL_REP`: Legal representative; the only role that can complete onboarding (e.g. sign terms and conditions).

                      - `CONTACT`: Default for all other relevant contacts who are not legal representatives.

                      '
            comment:
              type: string
              description: Any additional context or notes to consider for this lead.
            partnerContact:
              type: object
              required:
              - name
              - email
              properties:
                name:
                  type: string
                  description: Full name of the partner contact responsible for the lead.
                email:
                  type: string
                  format: email
                  description: Email address of the partner contact.
