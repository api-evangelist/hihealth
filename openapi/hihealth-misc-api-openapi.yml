openapi: 3.2.0
info:
  contact:
    name: API Support
    email: support@getpliant.com
    url: https://www.getpliant.com
  title: Pliant Partner Misc API
  description: Pliant Partner API
  version: 2.1.0
  license:
    name: MIT
    url: https://opensource.org/license/MIT
servers:
- url: https://partner-api.getpliant.com/api
  description: Pliant Production Server
- url: https://sandbox.partner-api.getpliant.com/api
  description: Pliant Sandbox Server
- url: https://pci-api.getpliant.com
  description: PCI Vault Production Server
- url: https://pci-sandbox.partner-api.getpliant.com
  description: PCI Vault Sandbox Server
security:
- bearerAuth: []
tags:
- name: Misc
  description: This tag is for miscellaneous operations
paths:
  /partner-management/lead:
    post:
      summary: Provide Lead
      description: Provide a new customer lead to Pliant for a customer referred by you, the partner. This lead will be picked up by our Sales team and they will onboard the customer as a new organization to Pliant. The details depend on the specific agreement Pliant has with you, the partner. More details can be found in our guides section.
      tags:
      - Misc
      operationId: create-lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - company
                properties:
                  company:
                    type: object
                    description: The legal entity that is referred to Pliant.
                    required:
                    - name
                    - country
                    - city
                    - postalCode
                    - address
                    properties:
                      name:
                        type: string
                        description: Name of the legal entity.
                      tradeRegisterNumber:
                        type: string
                        description: Trade register number of the legal entity.
                      country:
                        type: string
                        description: Country name (e.g. Germany) where the legal entity is registered. The full list of valid countries can be found in our [guides section](/docs/partner-customer-is-referred-to-pliant).
                        example: Germany
                        enum:
                        - Albania
                        - Andorra
                        - Armenia
                        - Australia
                        - Austria
                        - Belarus
                        - Belgium
                        - Bosnia and Herzegovina
                        - Brazil
                        - Bulgaria
                        - Canada
                        - Cayman Islands
                        - Croatia
                        - Cyprus
                        - Czechia
                        - Denmark
                        - Estonia
                        - Finland
                        - France
                        - Germany
                        - Gibraltar
                        - Greece
                        - Holy See
                        - Hong Kong
                        - Hungary
                        - Iceland
                        - India
                        - Indonesia
                        - Ireland
                        - Israel
                        - Italy
                        - Japan
                        - Kosovo
                        - Latvia
                        - Liechtenstein
                        - Lithuania
                        - Luxembourg
                        - Malta
                        - Mexico
                        - Moldova
                        - Monaco
                        - Montenegro
                        - Morocco
                        - Netherlands
                        - New Zealand
                        - North Macedonia
                        - Norway
                        - Poland
                        - Portugal
                        - Republic of Korea
                        - Romania
                        - Russia
                        - San Marino
                        - Serbia
                        - Singapore
                        - Slovakia
                        - Slovenia
                        - South Africa
                        - Spain
                        - Sweden
                        - Switzerland
                        - Thailand
                        - Tunisia
                        - Türkiye
                        - Ukraine
                        - United Arab Emirates
                        - United Kingdom
                        - United States
                      industry:
                        $ref: '#/components/schemas/OrganizationCreate/properties/leadData/properties/industry'
                      postalCode:
                        type: string
                        description: Postal code where legal entity is registered.
                      city:
                        type: string
                        description: City where legal entity is registered.
                      address:
                        type: string
                        description: Address where legal entity is registered.
                      accountType:
                        type: string
                        description: If known, which card product is requested by customer. Either with credit line (`CREDIT`) or without credit line (`PREFUND`).
                        enum:
                        - CREDIT
                        - PREFUND
                      yearlyRevenue:
                        type: integer
                        description: Estimated yearly revenue in EUR of referred legal entity.
                      numberOfEmployees:
                        type: integer
                        description: Number of employees of referred legal entity.
                      foundingYear:
                        type: integer
                        description: Founding year of referred legal entity.
                      plannedCreditLimit:
                        type: integer
                        deprecated: true
                        description: Deprecated, use `expectedMonthlyTransactionVolume` instead. If known, expected monthly transaction volume in EUR of the referred legal entity. Values provided here are treated as the expected monthly transaction volume.
                      expectedMonthlyTransactionVolume:
                        type: integer
                        description: If known, expected monthly transaction volume of the referred legal entity. Replaces `plannedCreditLimit`.
                      mainAccountCurrency:
                        type: string
                        description: 'Main currency of the account. Relevant for non-EUR and multi-currency organizations. Currently supported values: EUR, GBP, USD, CHF, CZK, DKK, HUF, NOK, PLN, RON, SEK, AED. Other values are rejected, but the supported list may be extended over time.'
                        example: EUR
                      customerRelationshipLength:
                        type: integer
                        description: How long the referred legal entity has been your customer, in months.
                      customerAcquisitionChannel:
                        type: string
                        description: Channel through which the customer was acquired.
                        enum:
                        - OUTBOUND
                        - INBOUND
                        - REFERRAL
                        - PARTNER
                        - CAMPAIGN
                      plannedNumberOfCards:
                        type: integer
                        description: If known, estimated amount of virtual and/or physical credit cards that reffered legal entity will issue.
                      paymentFrequency:
                        type: string
                        description: If known, desired payment frequency. For prefund you are able to provide `PREFUND` as valid value
                        enum:
                        - MONTHLY
                        - BI-WEEKLY
                        - WEEKLY
                        - DAILY
                        - PREFUND
                  contacts:
                    type:
                    - array
                    - 'null'
                    maxLength: 5
                    items:
                      type: object
                      description: Who to contact for onboarding of this legal entity (max. 5 contacts).
                      required:
                      - firstName
                      - lastName
                      - email
                      properties:
                        salutation:
                          type: string
                          description: Salutation of contact person, can be `MRS` or `MR`.
                          enum:
                          - MR
                          - MRS
                        firstName:
                          type: string
                          description: First name of contact person.
                        lastName:
                          type: string
                          description: Last name of contact person.
                        email:
                          type: string
                          description: Email address of contact person.
                        phone:
                          type: string
                          description: Phone number of contact person.
                        contactRole:
                          type: string
                          description: Role of the person within the legal entity. Those roles are a hint for our Sales team to know who to contact for onboarding. Only the legal representative (`LEGAL_REP`) can complete the onboarding process, for instance signing the terms and conditions. The `CONTACT` role is the default value for all other people, which are relevant for the onboarding but are not a legal representative of the company. Those people can later be assigned the common Pliant roles such as cardholder, accountant or admin.
                          enum:
                          - CONTACT
                          - LEGAL_REP
                          default: CONTACT
                  comment:
                    type: string
                    description: Any other important aspects to consider?
                  partnersOrganizationId:
                    type: string
                    deprecated: true
                    description: Unique identifier for customer/organization in your system. Used in various endpoints/callbacks to help you mapping Pliant organizationId accordingly.
                  partnerOrganizationId:
                    type: string
                    description: Unique identifier for customer/organization in your system. Used in various endpoints/callbacks to help you mapping Pliant organizationId accordingly.
                  partnerContact:
                    type: object
                    description: Contact person at the partner organization responsible for this lead.
                    required:
                    - name
                    - email
                    properties:
                      name:
                        type: string
                        description: Full name of the partner contact responsible for the lead.
                      email:
                        type: string
                        description: Email address of the partner contact.
      responses:
        '200':
          description: Ok
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /partner-management/organizations/{organizationId}/activate:
    post:
      summary: Activate Organization Authorization
      description: Activate an authorization for data sharing between an existing Pliant customer an your partner app. Only possible if the customer itself has initially started the process of data sharing.
      tags:
      - Misc
      operationId: activate-partner-organization-authorization
      parameters:
      - name: organizationId
        in: path
        required: true
        description: The unique identifier of the organization.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /partner-management/organizations/{organizationId}/deactivate:
    post:
      summary: Deactivate Organization Authorization
      description: Deactivate an authorization for data sharing between an existing Pliant customer an a partner app. **This action removes the authorization for data sharing between the customer and the partner app. Meaning you loose access to the customer's data via this API!**
      tags:
      - Misc
      operationId: deactivate-partner-organization-authorization
      parameters:
      - name: organizationId
        in: path
        required: true
        description: The unique identifier of the organization.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /partner-management/payment-program:
    get:
      summary: Get Payment Program
      description: 'Returns the payment program of the authenticated partner: its name, integration model,

        lifecycle status and eligibility (allowed countries and currencies with their defaults).

        The program is resolved from the credentials used to call the API, so a partner only

        ever sees its own program.


        An empty `allowedCountries` or `allowedCurrencies` list means the program does not

        restrict that dimension. Use the lists to offer only valid countries when creating

        organizations and only valid currencies when creating card accounts.'
      tags:
      - Misc
      operationId: get-payment-program
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProgram'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /partner-management/signing/jwks.json:
    get:
      summary: Get Partner Signing Public Key (JWKS)
      description: 'Returns a JSON Web Key Set (JWKS) containing a single public Ed25519 key for the authenticated partner.


        This public key is used to verify signatures in two scenarios:

        - **Callback signing**: Verify callback authenticity

        - **Redirect signing**: Verify redirect signatures


        **Important**: This key is per partner and is identified by the currently authenticated partner. The key is stable and there are currently no plans to rotate it. Consumers should cache this key and avoid fetching it frequently. Only fetch the key again if signature verification fails, as this may indicate a key rotation (though none is currently planned).'
      tags:
      - Misc
      operationId: get-partner-signing-jwks
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerSigningJwks'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /partner-management/update-settings:
    patch:
      summary: Update Partner Settings
      description: Once partners have received credentials to access our partner API, they are able to set up partner-related callback configuration via this self-service endpoint. Callback destination URLs are managed exclusively through /subscriptions and /subscriptions/bulk-upsert; this endpoint only manages the partner-wide OAuth credentials used to authenticate outbound callback delivery.
      tags:
      - Misc
      operationId: update-partner-settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - callbackSettings
                properties:
                  callbackSettings:
                    type: object
                    properties:
                      endpoint:
                        type: string
                        deprecated: true
                        description: Deprecated, has no effect. Callback destination URLs are managed exclusively through /subscriptions and /subscriptions/bulk-upsert.
                      oauth:
                        type: boolean
                        description: Whether to use oAuth Client Credentials flow or not when calling your endpoint.
                      tokenUri:
                        type: string
                        description: The URI where we can fetch the Bearer token for the oAuth Client Credentials flow. Only necessary if oAuth is used.
                      clientId:
                        type: string
                        description: The ClientId for the oAuth Client Credentials flow. Only necessary if oAuth is used.
                      clientSecret:
                        type: string
                        description: The ClientSecret for the oAuth Client Credentials flow. Only necessary if oAuth is used.
      responses:
        '200':
          description: Ok, the effective saved configuration with the secret redacted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  callbackSettings:
                    type: object
                    properties:
                      oauth:
                        type: boolean
                      tokenUri:
                        type: string
                      clientId:
                        type: string
                      clientSecretSet:
                        type: boolean
                        description: Whether a client secret is currently stored. The secret value itself is never returned.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
components:
  schemas:
    Error:
      type: object
      properties:
        errorCode:
          type: string
          description: The error code
        exceptionId:
          type: string
          format: uuid
          description: The id of the exception that was thrown
        message:
          type: string
          description: The cause of the error or further explanations on the error
    PaymentProgram:
      type: object
      properties:
        paymentProgramId:
          type: string
          format: uuid
          description: Identifier of the payment program
        name:
          type: string
          description: Name of the payment program
        integrationModel:
          type: string
          description: How the program integrates with Pliant
          enum:
          - DEFAULT
          - CAAS_LIGHT
          - EMBEDDED_WALLET
          - FULLY_EMBEDDED
        status:
          type: string
          description: Lifecycle status of the program. Only an ACTIVE program can be used for organizations.
          enum:
          - DRAFT
          - ACTIVE
          - INACTIVE
        allowedCountries:
          type: array
          description: Countries (ISO 3166-1 alpha-2) in which organizations of this program may be created. Empty means no program-level restriction.
          items:
            type: string
        defaultCountry:
          type:
          - string
          - 'null'
          description: Country (ISO 3166-1 alpha-2) to pre-select, if the program defines one
        allowedCurrencies:
          type: array
          description: Currencies (ISO 4217) in which card accounts of this program may be created. Empty means no program-level restriction.
          items:
            type: string
        defaultCurrency:
          type:
          - string
          - 'null'
          description: Currency (ISO 4217) to pre-select, if the program defines one
    PartnerSigningJwks:
      type: object
      description: JSON Web Key Set (JWKS) containing the partner's public Ed25519 signing key
      required:
      - keys
      properties:
        keys:
          type: array
          description: Array of JSON Web Keys
          items:
            type: object
            description: JSON Web Key (JWK) for Ed25519 public key
            required:
            - kty
            - use
            - crv
            - kid
            - key_ops
            - x
            - alg
            properties:
              kty:
                type: string
                enum:
                - OKP
                description: Key type - OKP (Octet Key Pair) for Ed25519
                example: OKP
              use:
                type: string
                enum:
                - sig
                description: Key use - indicates the key is for signing
                example: sig
              crv:
                type: string
                enum:
                - Ed25519
                description: Curve name for Ed25519
                example: Ed25519
              kid:
                type: string
                description: Key ID - unique identifier for this key, derived from the key material
                example: x4_cic8wT7GiHGhLR7OA5VAC6U3Dn5MDWNTDlCk_Qe4
              key_ops:
                type: array
                description: Key operations - indicates this key can be used for verification
                items:
                  type: string
                  enum:
                  - verify
                example:
                - verify
              x:
                type: string
                description: The public key value, base64url-encoded
                example: ybZX6AKkLQ2fPIUb_RelEpB7gThMVtuPiDn5upltFxI
              alg:
                type: string
                enum:
                - EdDSA
                description: Algorithm - EdDSA for Ed25519
                example: EdDSA
      example:
        keys:
        - kty: OKP
          use: sig
          crv: Ed25519
          kid: x4_cic8wT7GiHGhLR7OA5VAC6U3Dn5MDWNTDlCk_Qe4
          key_ops:
          - verify
          x: ybZX6AKkLQ2fPIUb_RelEpB7gThMVtuPiDn5upltFxI
          alg: EdDSA
    OrganizationCreate:
      type: object
      required:
      - name
      - country
      - currency
      - billingAddress
      - legalForm
      - tradeRegisterNumber
      - foundationDate
      - partnerOrganizationId
      properties:
        name:
          type: string
          maxLength: 255
          description: Legal entity name.
          example: Sample GmbH
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 country code.
          example: DE
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code.
          example: EUR
        billingAddress:
          type: object
          required:
          - streetName
          - streetNumber
          - postalCode
          - city
          - country
          properties:
            streetName:
              type: string
              maxLength: 128
              description: Street name.
            streetNumber:
              type: string
              maxLength: 128
              description: Street number.
            streetAdditional:
              type: string
              maxLength: 128
              description: Additional address line (e.g. apartment, floor).
            postalCode:
              type: string
              maxLength: 16
              description: Postal code. Validated against country-specific format.
            city:
              type: string
              maxLength: 64
              description: City.
            subdivisionCode:
              type: string
              maxLength: 6
              description: 'ISO 3166-2 subdivision code without the country prefix (e.g. `NY` for New York, US). Optional — recommended for US addresses.

                '
            country:
              type: string
              pattern: ^[A-Z]{2}$
              description: ISO 3166-1 alpha-2 country code. Must match the top-level `country` field.
              example: DE
        legalForm:
          type: string
          maxLength: 128
          description: 'Legal form of the entity. Use a value for the organization''s `country` from

            [Legal forms by country](/docs/legal-forms-by-country).

            Preserve the exact spelling, capitalization, spaces, and punctuation.

            '
          example: GmbH
        vatId:
          type: string
          description: VAT identification number.
          example: DE123456789
        tradeRegisterNumber:
          type: string
          maxLength: 64
          description: Trade register number of the legal entity.
          example: HRB123456
        nationalRegisterCourt:
          type: string
          description: National register court. Required for DE only.
          example: Amtsgericht München
        foundationDate:
          type: string
          format: date
          description: Foundation date of the legal entity in ISO 8601 format (YYYY-MM-DD). Must be in the past.
          example: '2015-03-15'
        partnerOrganizationId:
          type: string
          maxLength: 128
          description: "Your permanent reference ID for this organization (e.g. your internal business customer ID). Stored verbatim, \nechoed back on all responses, and enforced as unique per partner — prevents logical duplicates across separate API calls. \nDistinct from the Idempotency-Key header, which handles network-level retry safety.\n"
          example: internal-123
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 'Arbitrary key-value pairs for storing additional information on this Pliant object.

            For your own use and reference.

            '
          example:
            accountManagerEmail: account.manager@org.de
        leadData:
          type: object
          description: Additional lead information used for sales qualification and CRM enrichment.
          required:
          - accountType
          - customerAcquisitionChannel
          - customerRelationshipLength
          - contacts
          properties:
            accountType:
              type: string
              description: If known, which card product is requested by customer. Either with credit line (=credit) or without credit line (=prefund).
              enum:
              - CREDIT
              - PREFUNDED
            industry:
              type: string
              description: Industry of the legal entity.
              enum:
              - ACCOUNTING
