  /organizations/{organizationId}/bank-accounts:
    get:
      summary: Get Organization's External Bank Accounts
      description: Fetch the bank accounts of the provided organization which are external to Pliant, meaning not owned by Pliant but the organization itself. The bank accounts can then be used for instance for cashback redemption etc.
      tags:
      - Organizations
      operationId: get-organizations-external-bank-accounts
      parameters:
      - name: organizationId
        in: path
        required: true
        description: The organization for which the bank accounts should be fetched.
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: The maximum number of items to return per page. The default value if not provided is 100, the maximum allowed value is 1000.
        schema:
          type: integer
      - name: page
        in: query
        description: The page number to return, starting with 0, this counts up to the total number of pages. The total number of pages is determined by the total number of records divided by the limit.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The field to sort by.
        schema:
          type: string
          enum:
          - id
          - createdAt
          - bankName
      - name: sortDirection
        in: query
        description: The direction to sort by.
        schema:
          type: string
          enum:
          - ASC
          - DESC
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationBankAccount'
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    servers:
    - url: https://partner-api.getpliant.com/api
      description: Pliant Production Server
    - url: https://sandbox.partner-api.getpliant.com/api
      description: Pliant Sandbox Server
    - url: https://pci-api.getpliant.com
      description: PCI Vault Production Server
    - url: https://pci-sandbox.partner-api.getpliant.com
      description: PCI Vault Sandbox Server
  /organizations/{organizationId}/bank-accounts/{bankAccountId}:
    get:
      summary: Get Organization's External Bank Account
      description: Fetch a specific external bank account by its ID for the provided organization.
      tags:
      - Organizations
      operationId: get-organization-external-bank-account
      parameters:
      - name: organizationId
        in: path
        required: true
        description: The unique identifier of the organization.
        schema:
          type: string
          format: uuid
      - name: bankAccountId
        in: path
        required: true
        description: The unique identifier of the bank account.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBankAccount'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
