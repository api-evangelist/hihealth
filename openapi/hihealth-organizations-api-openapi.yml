openapi: 3.2.0
info:
  title: Hihealth Organizations API
  version: 2.1.0
  contact:
    name: API Support
    email: support@getpliant.com
    url: https://www.getpliant.com
  license:
    name: MIT
    url: https://opensource.org/license/MIT
  description: 'Operations tagged Organizations across 2 of this provider''s published API definitions: hihealth-pliant-customer-api-openapi.yml, hihealth-pliant-partner-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://partner-api.getpliant.com/api
  description: Pliant Production Server
- url: https://sandbox.partner-api.getpliant.com/api
  description: Pliant Sandbox Server
- url: https://pci-api.getpliant.com
  description: PCI Vault Production Server
- url: https://pci-sandbox.partner-api.getpliant.com
  description: PCI Vault Sandbox Server
security:
- bearerAuth: []
tags:
- name: Organizations
  description: This tag is for operations related to organizations
paths:
  /organizations:
    get:
      summary: List Organizations
      description: Returns a list of organizations. You can filter by status or VAT ID to find specific organizations. You can use the `limit`, `page`, `sortBy` and `sortDirection` parameters to filter and sort the results.
      tags:
      - Organizations
      operationId: list-organizations
      parameters:
      - name: status
        in: query
        description: The status of the organizations to filter by.
        schema:
          type: string
          description: The status of the organization, see [our guides](/docs/organization-entity) for more details.
          enum:
          - ONBOARDING_STARTED
          - ONBOARDING_RISK_AND_COMPLIANCE
          - ONBOARDING_MANDATES_AND_TERMS
          - ACTIVE
          - DEACTIVATED
          - CANCELLED
          example: ONBOARDING_STARTED
      - name: vatId
        in: query
        description: The VAT ID of the organization to filter by.
        schema:
          type: string
      - name: limit
        in: query
        description: The maximum number of items to return per page. The default value if not provided is 100, the maximum allowed value is 1000.
        schema:
          type: integer
      - name: page
        in: query
        description: The page number to return, starting with 0, this counts up to the total number of pages. The total number of pages is determined by the total number of records divided by the limit.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The field to sort by.
        schema:
          type: string
          enum:
          - id
          - name
          - status
          - createdAt
      - name: sortDirection
        in: query
        description: The direction to sort by.
        schema:
          type: string
          enum:
          - ASC
          - DESC
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        organizationId:
                          type: string
                          format: uuid
                          description: The id of the organization.
                        name:
                          type: string
                          description: The name of the organization.
                        status:
                          $ref: '#/paths/~1organizations/get/parameters/0/schema'
                        vatId:
                          type:
                          - string
                          - 'null'
                          description: The VAT ID of the organization, if available.
                        cardAccounts:
                          $ref: '#/paths/~1organizations~1{organizationId}/get/responses/200/content/application~1json/schema/properties/cardAccounts'
                        paymentProgramId:
                          type: string
                          format: uuid
                          description: The id of the payment program this organization belongs to.
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
    post:
      summary: Create Organization
      description: Creates a new organization for onboarding via a partner integration.
      tags:
      - Organizations
      operationId: create-organization
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 256
        description: 'An opaque, unique string that identifies this request — any sufficiently random value (e.g. a UUID) is acceptable. Re-delivery of the same key for the same operation is a no-op. Reusing a key with a different request body returns 409. Follows the IETF HTTP API Working Group''s Idempotency-Key specification: https://github.com/ietf-wg-httpapi/idempotency

          '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/OrganizationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCreateResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          description: 'Unprocessable Entity. The organization cannot be onboarded. This may be due to a duplicate registration detected internally. The specific reason is intentionally not disclosed.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errorCode: ORGANIZATION_CANNOT_BE_ONBOARDED
                exceptionId: b2c3d4e5-f6a7-8901-bcde-f12345678901
                message: The organization cannot be onboarded.
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    servers:
    - url: https://partner-api.getpliant.com/api
      description: Pliant Production Server
    - url: https://sandbox.partner-api.getpliant.com/api
      description: Pliant Sandbox Server
    - url: https://pci-api.getpliant.com
      description: PCI Vault Production Server
    - url: https://pci-sandbox.partner-api.getpliant.com
      description: PCI Vault Sandbox Server
  /organizations/{organizationId}:
    get:
      summary: Organization Details
      description: Returns a single organization by its ID
      tags:
      - Organizations
      operationId: get-organization-details
      parameters:
      - name: organizationId
        in: path
        required: true
        description: The unique identifier of the organization.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizationId:
                    type: string
                    format: uuid
                    description: The unique identifier of the organization.
                  name:
                    type: string
                    description: The legal name of the organization.
                  status:
                    $ref: '#/paths/~1organizations/get/parameters/0/schema'
                  syncType:
                    type:
                    - string
                    - 'null'
                    enum:
                    - FULL
                    - PARTIAL
                    description: The sync type of the organization, will always be `FULL` for now.
                  integrationType:
                    type:
                    - string
                    - 'null'
                    enum:
                    - PARTNER
                    description: The integration type of the organization, will always be `PARTNER`.
                  creditLimit:
                    type: object
                    description: The credit limit for the organization, if applicable. For prefund organizations this value is always 0 EUR. See our [guides](/docs/organization-entity#account-limits-and-balance) for more details regarding limits and balances.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  availableLimit:
                    type: object
                    description: The available spending capacity for the organization. See our [guides](/docs/organization-entity#account-limits-and-balance) for more details regarding limits and balances.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  balance:
                    type: object
                    description: The balance of the organization, which represents movements (positive and negative) on the account. See our [guides](/docs/organization-entity#account-limits-and-balance) for more details regarding limits and balances.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  cardsAccounts:
                    type: array
                    description: 'Organizations are able to define account numbers that are used when exporting data from Pliant to an accounting system (e.g. DATEV). This is optional and only used for accounting purposes. Typically this is set on card account level but we do have fallbacks on organization level.

                      **Important**: The properties and values are not identifiers for the companies card accounts within Pliant. Please use the respective endpoints to gather information about the card accounts.

                      '
                    items:
                      type: object
                      properties:
                        number:
                          type:
                          - number
                          - 'null'
                        type:
                          type: string
                          enum:
                          - CREDITOR_ACCOUNT
                          - PAYMENT_ACCOUNT
                  tradeName:
                    type:
                    - string
                    - 'null'
                    description: "An organization may use a different name, e.g. for marketing purposes. In case a trade name is provided, this will be the one printed on the employees' physical cards, instead of the organization's legal name.\nThis field is only optional, as long as the legal `name` of the organization is not longer than 20 characters.\n \n**If the legal `name` is longer than 20 characters, the trade name is required:**\n  - The trade name maximum length is 20 characters, since it is printed on the physical cards.\n  - Trade name cannot be `null` or empty.\n"
                  legalForm:
                    type: string
                    description: 'The legal form of the organization. Use a value for the organization''s `country` from

                      [Legal forms by country](/docs/legal-forms-by-country).

                      Preserve the exact spelling, capitalization, spaces, and punctuation.

                      '
                  foundationDate:
                    type: string
                    format: date
                    description: The founding date of the organization in the format `DD.MM.YYYY`.
                  country:
                    type: string
                    description: The country of the organization in ISO 3166-1 alpha-2 notation.
                    minLength: 2
                    maxLength: 2
                  accountType:
                    type: string
                    deprecated: true
                    description: 'Replaced by `cardAccount.accountType`, see [API endpoint](./get-card-accounts). This field now shows the account type of the default card account of this organization. Note: a `CREDIT` card account can also top up their balance with a one-time prefund payment. This does not change the `accountType`, but just shows up as a bigger `availableLimit`.'
                    enum:
                    - CREDIT
                    - PREFUNDED
                  partnersOrganizationId:
                    type:
                    - string
                    - 'null'
                    description: Optional field, referencing the id used by the partner to identify this organization.
                    deprecated: true
                  partnerOrganizationId:
                    type:
                    - string
                    - 'null'
                    description: Optional field, referencing the id used by the partner to identify this organization.
                  paymentFrequency:
                    type: string
                    deprecated: true
                    description: Replaced by `cardAccount.paymentFrequency`, see [API endpoint](./get-card-accounts). This field now shows the payment frequency of the default card account of this organization.
                    enum:
                    - DAILY
                    - WEEKLY
                    - BI_WEEKLY
                    - MONTHLY
                    - PREFUNDED
                  nationalRegisterCourt:
                    type: string
                    description: The national register court of the organization.
                  nationalRegisterId:
                    type:
                    - string
                    - 'null'
                    description: The national register id of the organization.
                  nationalRegisterType:
                    type:
                    - string
                    - 'null'
                    description: The national register type of the organization.
                  tradeRegisterNumber:
                    type: string
                    description: The trade register number of the organization.
                  vatId:
                    type:
                    - string
                    - 'null'
                    description: The VAT ID of the organization, if available.
                  billingEmail:
                    type:
                    - string
                    - 'null'
                    description: The billing email of the organization.
                  billingAddress:
                    type: object
                    description: The billing address of the organization.
                    properties:
                      id:
                        type: string
                        description: The unique identifier of the address.
                      type:
                        type: string
                        description: The type of the address, here always `BILLING`.
                        enum:
                        - BILLING
                        - DELIVERY
                      country:
                        type:
                        - string
                        - 'null'
                        description: The country of the address in ISO 3166-1 alpha-2 notation. Might be `null` for non-active organizations, but is set for active organizations.
                        minLength: 2
                        maxLength: 2
                      city:
                        type:
                        - string
                        - 'null'
                        description: The city of the address. Might be `null` for non-active organizations, but is set for active organizations.
                      postalCode:
                        type:
                        - string
                        - 'null'
                        description: The postal code of the address. Might be `null` for non-active organizations, but is set for active organizations.
                      streetFull:
                        type:
                        - string
                        - 'null'
                        description: The full street name of the address. Might be `null` for non-active organizations, but is set for active organizations.
                      streetName:
                        type:
                        - string
                        - 'null'
                        description: The street name of the address. Might be `null` for non-active organizations, but is set for active organizations.
                      streetNumber:
                        type:
                        - string
                        - 'null'
                        description: The street number of the address. Might be `null` for non-active organizations, but is set for active organizations.
                      streetAdditional:
                        type:
                        - string
                        - 'null'
                        description: Optional additional street information.
                  deliveryAddress:
                    type:
                    - object
                    - 'null'
                    description: The delivery address of the organization.
                    properties:
                      id:
                        type: string
                        description: The unique identifier of the address.
                      type:
                        type: string
                        description: The type of the address, here always `DELIVERY`.
                        enum:
                        - BILLING
                        - DELIVERY
                      country:
                        type:
                        - string
                        - 'null'
                        description: The country of the address in ISO 3166-1 alpha-2 notation. Might be `null` for non-active organizations, but is set for active organizations.
                        minLength: 2
                        maxLength: 2
                      city:
                        type:
                        - string
                        - 'null'
                        description: The city of the address. Might be `null` for non-active organizations, but is set for active organizations.
                      postalCode:
                        type:
                        - string
                        - 'null'
                        description: The postal code of the address. Might be `null` for non-active organizations, but is set for active organizations.
                      streetFull:
                        type:
                        - string
                        - 'null'
                        description: The full street name of the address. Might be `null` for non-active organizations, but is set for active organizations.
                      streetName:
                        type:
                        - string
                        - 'null'
                        description: The street name of the address. Might be `null` for non-active organizations, but is set for active organizations.
                      streetNumber:
                        type:
                        - string
                        - 'null'
                        description: The street number of the address. Might be `null` for non-active organizations, but is set for active organizations.
                      streetAdditional:
                        type:
                        - string
                        - 'null'
                        description: Optional additional street information.
                  processingAccount:
                    type: object
                    deprecated: true
                    description: Replaced by `cardAccount.bankAccountInformation`, see [API endpoint](./get-card-accounts). This field now shows the Pliant-internal IBAN of the default card account of this organization.
                    properties:
                      beneficiary:
                        type: string
                        description: The beneficiary of the processing account.
                      bankName:
                        type:
                        - string
                        - 'null'
                        description: The name of the bank of the processing account.
                      iban:
                        type:
                        - string
                        - 'null'
                        description: The IBAN of the processing account.
                      bic:
                        type:
                        - string
                        - 'null'
                        description: The BIC of the processing account.
                        example: SPBIDE3B
                  isCompanyNamePrintable:
                    type: boolean
                    description: Determines if the company name should be printed on the card.
                  eligibleForHybridAccount:
                    type: boolean
                    description: Determines if the organization is eligible for a hybrid account. A hybrid account is a credit account with additional prefund balance.
                  cardAccounts:
                    type: array
                    description: The [card accounts](/docs/card-account) of the organization. At least one card account is required.
                    items:
                      type: object
                      description: A [card account](/docs/card-account) of the organization.
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the card account.
                        name:
                          type: string
                          description: The name of the card account.
                        status:
                          type: string
                          description: The status of the card account. A card account with `status` `SUPERSEDED` was replaced by a successor card account and is kept for historical reasons only. Read the [card account](/reference/get-card-account-details) to find its successor (`supersededBy`).
                          enum:
                          - ACTIVE
                          - PENDING
                          - DEACTIVATED
                          - CANCELLED
                          - SUPERSEDED
                        defaultAccount:
                          type: boolean
                          description: Indicates whether this is the default card account. There is always one active default card account.
                  missingReceiptNotifications:
                    type: boolean
                    description: If set to `true`, the organization will receive notifications about missing receipts. If set to `false`, the organization will not receive notifications about missing receipts.
                  fxFeePercentage:
                    type:
                    - number
                    - 'null'
                    description: 'The per-organization fee (as a percentage of the transaction amount) that is charged for foreign exchange transactions. This value is specific to this organization. Example: `2.1`.'
                    format: float
                    example: 2.1
                    minimum: 0
                    maximum: 100
                  paymentProgramId:
                    type: string
                    format: uuid
                    description: The id of the payment program this organization belongs to.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
    patch:
      summary: Organization Update
      description: Update an existing organization. You need to provide all fields with their current values if they should remain unchanged. If you want to update a field, you need to provide the new value. If you want to remove a field, you need to provide `null` as value.
      tags:
      - Organizations
      operationId: update-organization
      parameters:
      - name: organizationId
        in: path
        required: true
        description: The unique identifier of the organization.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/OrganizationUpdate'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/OrganizationUpdate'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    servers:
    - url: https://partner-api.getpliant.com/api
      description: Pliant Production Server
    - url: https://sandbox.partner-api.getpliant.com/api
      description: Pliant Sandbox Server
    - url: https://pci-api.getpliant.com
      description: PCI Vault Production Server
    - url: https://pci-sandbox.partner-api.getpliant.com
      description: PCI Vault Sandbox Server
  /organizations/subscription:
    post:
      summary: 'Callback: Add/Update'
      description: Subscribe to callbacks for this entity or change an existing callback. For the different organization status, see documentation.
      tags:
      - Organizations
      operationId: create-organization-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackUrl:
                  type: string
                  format: uri
                  example: https://myserver.com/send/callback/here
                  description: The URL to send the callback to. Must be a valid and reachable URL. We do some basic validation to ensure the URL is syntactically correct and reachable for Pliant. Only HTTPS URLs are supported.
                eventTypes:
                  type: array
                  description: The event types to subscribe to.
                  items:
                    type: string
                    enum:
                    - ORGANIZATION_ADDED
                    - ORGANIZATION_CONFIG_CHANGED
                    - ORGANIZATION_DETAILS_CHANGED
                    - ORGANIZATION_LIMIT_CHANGED
                    - ORGANIZATION_STATE_CHANGED
                    - ORGANIZATION_SYNCTYPE_CHANGED
                    - ORGANIZATION_BALANCE_UPDATED
                    - AUTHORIZATION_PENDING
                    - AUTHORIZATION_GRANTED
                    - AUTHORIZATION_REVOKED
                    - REPRESENTATIVE_SUBMISSION_STATUS_CHANGED
                    - REPRESENTATIVE_LEGITIMATION_STATUS_CHANGED
                    - DOCUMENT_CUSTOMER_STATUS_CHANGED
                    - DIRECT_DEBIT_STATUS_CHANGED
                    - BANK_CONNECTION_STATUS_CHANGED
              required:
              - callbackUrl
              - eventTypes
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      callbacks:
        organizationUpdated:
          '{$request.body#/callbackUrl}':
            post:
              description: Callback structure for organization update (ORGANIZATION_ADDED, ORGANIZATION_DETAILS_CHANGED, ORGANIZATION_CONFIG_CHANGED, ORGANIZATION_LIMIT_CHANGED, ORGANIZATION_STATE_CHANGED, ORGANIZATION_SYNCTYPE_CHANGED) events. The callback for event type `ORGANIZATION_ADDED` will be triggered and send to partners which refer organizations to Pliant and it will be send prior to an active integration with the partner. This is necessary, since the organization comes first and then the partner integration can be activated. Hence this callback can only be send before an active integration with the partner exists. It is send to the partner which is stored as the referring partner in Pliant.
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                $ref: '#/components/requestBodies/OrganizationUpdatedCallback'
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
        organizationBalanceUpdated:
          '{$request.body#/callbackUrl}':
            post:
              description: Callback structure for organization balance update (ORGANIZATION_BALANCE_UPDATED) events.
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
