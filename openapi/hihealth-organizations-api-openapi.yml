components:
  schemas:
    OrganizationAuthorizationCallback:
      type: object
      properties:
        partnerId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        partnerOrganizationId:
          type:
          - string
          - 'null'
    Organization:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
          description: The id of the organization.
        name:
          type: string
          description: The name of the organization.
        status:
          type: string
          description: The status of the organization, see [our guides](/docs/organization-entity) for more details.
          enum:
          - ONBOARDING_STARTED
          - ONBOARDING_RISK_AND_COMPLIANCE
          - ONBOARDING_MANDATES_AND_TERMS
          - ACTIVE
          - DEACTIVATED
          - CANCELLED
          example: ONBOARDING_STARTED
        vatId:
          type:
          - string
          - 'null'
          description: The VAT ID of the organization, if available.
        cardAccounts:
          type: array
          description: The [card accounts](/docs/card-account) of the organization. At least one card account is required.
          items:
            type: object
            description: A [card account](/docs/card-account) of the organization.
            properties:
              id:
                type: string
                format: uuid
                description: The id of the card account.
              name:
                type: string
                description: The name of the card account.
              status:
                type: string
                description: The status of the card account. A card account with `status` `SUPERSEDED` was replaced by a successor card account and is kept for historical reasons only. Read the [card account](/reference/get-card-account-details) to find its successor (`supersededBy`).
                enum:
                - ACTIVE
                - PENDING
                - DEACTIVATED
                - CANCELLED
                - SUPERSEDED
              defaultAccount:
                type: boolean
                description: Indicates whether this is the default card account. There is always one active default card account.
        paymentProgramId:
          type: string
          format: uuid
          description: The id of the payment program this organization belongs to.
    OrganizationRiskDetail:
      type: object
      properties:
        organizationId:
          type: string
          description: The ID of the organization.
          format: uuid
        name:
          type: string
          description: The name of the organization.
        status:
          $ref: '#/components/schemas/Organization/properties/status'
        riskAndCompliance:
          type:
          - object
          - 'null'
          description: Risk and compliance process details on the company (especially helpful during onboarding process).
          properties:
            representatives:
              description: During Pliant's risk and compliance check we may or may not need data from users that don't necessarily need to be created as cardholders for the organization that is applying for credit cards (e.g. UBOs). Those people are referred to as representatives.
              type: array
              default: []
              items:
                type: object
                properties:
                  representativeId:
                    type: string
                    description: The ID of the representative.
                  representativeSubmissionStatus:
                    type: string
                    enum:
                    - INFO_REQUESTED
                    - INFO_FILLED
                    - INFO_SUBMITTED
                    - INTERNAL_ONLY
                    description: '* `INFO_REQUESTED` - Additional information are requested from the representative.

                      * `INFO_FILLED` - The representative has provided and saved some of the information requested by Pliant, but it is not fully submitted yet.

                      * `INFO_SUBMITTED` - The representative has filled all additional information that was requested by Pliant and has submitted it.

                      * `INTERNAL_ONLY` - Data about the representative is only used internally by Pliant and is not requested from the representative.

                      '
                  representativeLegitimationStatus:
                    type:
                    - string
                    - 'null'
                    enum:
                    - NOT_REQUESTED
                    - ONGOING
                    - COMPLETED
                    - CANCELLED
                    description: '* `NOT_REQUESTED` - The legitimation documents have not been requested yet.

                      * `ONGOING` - The legitimation process is ongoing.

                      * `COMPLETED` - The legitimation process is completed (does not mean successfully though, please check `representativeSubmissionStatus`).

                      * `CANCELLED` - The legitimation process is cancelled.

                      '
            sepaDirectDebitMandateStatus:
              type: string
              enum:
              - REQUESTED
              - SIGNED_PARTIALLY
              - SIGNED
              - NOT_NEEDED
              description: '* `REQUESTED` - The direct debit mandate is requested.

                * `SIGNED_PARTIALLY` - The direct debit mandate is partially signed.

                * `SIGNED` - The direct debit mandate is signed.

                * `NOT_NEEDED` - In some cases a direct debit mandate is not required from the customer (e.g. for organizations using `PREFUND`).

                '
            documentsCustomer:
              description: Additional documents requested from the customer.
              type: array
              items:
                type:
                - object
                - 'null'
                properties:
                  documentId:
                    type: string
                  category:
                    type: string
                  subcategory:
                    type:
                    - string
                    - 'null'
                  status:
                    type:
                    - string
                    - 'null'
                    enum:
                    - DRAFT
                    - REQUESTED
                    - SUBMITTED
                    - VERIFIED
                    - NOT_NEEDED
                    description: "* `DRAFT` - The document is in draft status and Pliant is about to request it from the customer.\n* `REQUESTED` - The document is requested from the customer.\n* `SUBMITTED` - The document is submitted by the customer.\n* `VERIFIED` - The document is verified by Pliant.                \n* `NOT_NEEDED` - The document is not needed anymore.\n"
        documentsLegal:
          description: Flag to determine if the organizations has agreed to the legal documents required by Pliant.
          type: string
          enum:
          - REQUESTED
          - SIGNED
        bankConnectionStatus:
          type: string
          enum:
          - NOT_REQUIRED
          - ACTIVE
          - INACTIVE
          description: '* `NOT_REQUIRED` - Connecting a bank account is not needed for the given organization.

