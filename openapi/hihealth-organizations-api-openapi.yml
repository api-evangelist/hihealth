      summary: 'Callback: Remove'
      description: Remove a callback subscription for this entity.
      tags:
      - Organizations
      operationId: remove-organization-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventTypes:
                  type: array
                  description: The event types to unsubscribe from.
                  items:
                    type: string
                    enum:
                    - ORGANIZATION_ADDED
                    - ORGANIZATION_CONFIG_CHANGED
                    - ORGANIZATION_DETAILS_CHANGED
                    - ORGANIZATION_LIMIT_CHANGED
                    - ORGANIZATION_STATE_CHANGED
                    - ORGANIZATION_SYNCTYPE_CHANGED
                    - ORGANIZATION_BALANCE_UPDATED
                    - AUTHORIZATION_PENDING
                    - AUTHORIZATION_GRANTED
                    - AUTHORIZATION_REVOKED
                    - REPRESENTATIVE_SUBMISSION_STATUS_CHANGED
                    - REPRESENTATIVE_LEGITIMATION_STATUS_CHANGED
                    - DOCUMENT_CUSTOMER_STATUS_CHANGED
                    - DIRECT_DEBIT_STATUS_CHANGED
                    - BANK_CONNECTION_STATUS_CHANGED
              required:
              - eventTypes
      responses:
        '200':
          description: Ok
