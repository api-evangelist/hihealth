openapi: 3.2.0
info:
  contact:
    name: API Support
    email: support@getpliant.com
    url: https://www.getpliant.com
  title: Pliant Partner Card Requests API
  description: Pliant Partner API
  version: 2.1.0
  license:
    name: MIT
    url: https://opensource.org/license/MIT
servers:
- url: https://partner-api.getpliant.com/api
  description: Pliant Production Server
- url: https://sandbox.partner-api.getpliant.com/api
  description: Pliant Sandbox Server
- url: https://pci-api.getpliant.com
  description: PCI Vault Production Server
- url: https://pci-sandbox.partner-api.getpliant.com
  description: PCI Vault Sandbox Server
security:
- bearerAuth: []
tags:
- name: Card Requests
  description: This tag is for operations related to card requests
paths:
  /cards/requests:
    get:
      summary: List Card Requests
      description: Returns a list of card requests. You can use the `limit`, `page`, `sortBy` and `sortDirection` parameters to filter and sort the results.
      tags:
      - Card Requests
      operationId: get-card-requests
      parameters:
      - name: organizationId
        in: query
        required: true
        description: The unique identifier of the organization.
        schema:
          type: string
          format: uuid
      - name: cardAccountId
        in: query
        description: The unique identifier of the card account. Card requests keep the card account id they were created with. If a card account was superseded, query both the superseded id and its successor (`supersededBy`) to get a complete list across the switch.
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: The status to filter by.
        schema:
          type: string
          enum:
          - APPROVED
          - REJECTED
          - PENDING
          - CANCELED
      - name: type
        in: query
        description: The type to filter by.
        schema:
          type: string
          enum:
          - VIRTUAL
          - SINGLE_USE
          - TRAVEL
          - PHYSICAL
          - BLACK
      - name: cardholderId
        in: query
        description: The unique identifier of the cardholder.
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: The maximum number of items to return per page. The default value if not provided is 100, the maximum allowed value is 1000.
        schema:
          type: integer
      - name: page
        in: query
        description: The page number to return, starting with 0, this counts up to the total number of pages. The total number of pages is determined by the total number of records divided by the limit.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The field to sort by.
        schema:
          type: string
          enum:
          - organizationId
          - status
          - cardholderId
          - createdAt
      - name: sortDirection
        in: query
        description: The direction to sort by.
        schema:
          type: string
          enum:
          - ASC
          - DESC
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CardRequest'
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
    post:
      summary: Create Card Request
      description: 'Create a card request for a specific cardholder.


        **This endpoint has changed in comparison to the previous version of the API.** The following changes were made:

        - changed the HTTP response code to 202 Accepted and removed the response body, to reflect the asynchronous nature of this endpoint

        - deprecated `type` and replaced it with `cardConfig`'
      tags:
      - Card Requests
      operationId: create-card-request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - organizationId
                - cardholderId
                properties:
                  organizationId:
                    type: string
                    format: uuid
                    description: The ID of the organization to create the card request for.
                  cardholderId:
                    type: string
                    format: uuid
                    description: The id of the [cardholder](/docs/cardholder-entity) to create this card request for. This cardholder needs to have a phone number, otherwise 3DS security mechanism during a purchase will not work.
                  cardAccountId:
                    type: string
                    format: uuid
                    description: The ID of the [card account](/docs/card-account) to create the card request for. If not provided, the card will be created for the default [card account](/docs/card-account) of the organization. If the given card account has `status` `SUPERSEDED`, the request is transparently resolved to its successor (`supersededBy`) and the response carries the id of that successor card account.
                  cardControls:
                    $ref: '#/components/schemas/CardControls'
              - type: object
                required:
                - validityPeriod
                - requestedTransactionLimit
                - requestedLimit
                - comment
                properties:
                  type:
                    type:
                    - string
                    - 'null'
                    deprecated: true
                    enum:
                    - VIRTUAL
                    - SINGLE_USE
                    - PHYSICAL
                    - BLACK
                    - TRAVEL
                    description: "Deprecated, please use `cardConfig` instead.\n`VIRTUAL` - Virtual credit card\n`SINGLE_USE` - One-time virtual credit card (only one authorization allowed per card)  \n`PHYSICAL` - Physical credit card\n`BLACK` - Physical black premium credit card\n`TRAVEL` - Virtual cards used specifically in travel industry related use cases\nEither `type` or `cardConfig` has to be provided. Please prefer `cardConfig`.\n"
                  cardConfig:
                    type:
                    - string
                    - 'null'
                    description: The Pliant card configuration of this card. This describes all feature of this card in one single configuration, e.g. the type of the card and also the design of the card etc. It replaces the deprecated card `type`. Please refer to the [guide section](/docs/card-entity) to learn more about possible values. Either `type` or `cardConfig` has to be provided. Please prefer `cardConfig`.
                  validityPeriod:
                    type: string
                    description: Date when card expires in months; Mandatory for virtual cards. For cards with type `PHYSICAL` or `BLACK` this is set to 36 months automatically, for cards with type `SINGLE_USE` it is set to 12 months automatically.
                    enum:
                    - '3'
                    - '6'
                    - '9'
                    - '12'
                    - '18'
                    - '24'
                    - '30'
                    - '36'
                  label:
                    type:
                    - string
                    - 'null'
                    description: Available only for virtual cards with a `cardConfig` containing `VIRTUAL` or `TRAVEL`. The maximum length is 40 characters.
                    maxLength: 40
                  purpose:
                    type: string
                    description: Available only for virtual cards with type `SINGLE_USE`
                  requestedTransactionLimit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  requestedMonthlyLimit:
                    type: object
                    deprecated: true
                    description: Use `requestedLimit` instead
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  requestedLimit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  limitRenewFrequency:
                    type: string
                    enum:
                    - DAILY
                    - WEEKLY
                    - MONTHLY
                    - QUARTERLY
                    - ANNUAL
                    - TOTAL
                    description: '* `DAILY` - The card limit is renewed every day

                      * `WEEKLY` - The card limit is renewed every week

                      * `MONTHLY` - The card limit is renewed every calendar month

                      * `QUARTERLY` - The card limit is renewed every calendar quarter

                      * `ANNUAL` - The card limit is renewed every year

                      * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

                      '
                  comment:
                    type: string
                    minLength: 0
                    maxLength: 200
                  additionalLimits:
                    type:
                    - array
                    - 'null'
                    description: Optional additional limits to request on the card. Forwarded to card management and applied when the request is approved.
                    items:
                      $ref: '#/paths/~1cards~1limits~1{cardId}/put/requestBody/content/application~1json/schema/allOf/1/properties/additionalLimits/items'
      responses:
        '202':
          description: Accepted. The request was successful, please wait until the callback is triggered, since this is an asynchronous operation.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/CardRequestCreate'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /cards/requests/subscription:
    post:
      summary: 'Callback: Add/Update'
      description: Subscribe to callbacks for this entity or change an existing callback.
      tags:
      - Card Requests
      operationId: create-card-request-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackUrl:
                  type: string
                  format: uri
                  example: https://myserver.com/send/callback/here
                  description: The URL to send the callback to. Must be a valid and reachable URL. We do some basic validation to ensure the URL is syntactically correct and reachable for Pliant. Only HTTPS URLs are supported.
                eventTypes:
                  type: array
                  description: The event types to subscribe to.
                  items:
                    type: string
                    enum:
                    - CARD_REQUEST_CREATED
                    - CARD_REQUEST_APPROVED
                    - CARD_REQUEST_REJECTED
              required:
              - callbackUrl
              - eventTypes
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      callbacks:
        cardRequestsUpdated:
          '{$request.body#/callbackUrl}':
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                $ref: '#/components/requestBodies/CardRequestCallback'
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
    delete:
      summary: 'Callback: Remove'
      description: Remove a callback subscription for this entity.
      tags:
      - Card Requests
      operationId: remove-card-request-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventTypes:
                  type: array
                  description: The event types to unsubscribe from.
                  items:
                    type: string
                    enum:
                    - CARD_REQUEST_CREATED
                    - CARD_REQUEST_APPROVED
                    - CARD_REQUEST_REJECTED
              required:
              - eventTypes
      responses:
        '200':
          description: Ok
  /cards/requests/{cardRequestId}:
    get:
      summary: Card Request Details
      description: 'Returns details on a single card Request.


        **This endpoint has changed in comparison to the previous version of the API.** The following changes were made:

        - added `cardControls` to response body'
      tags:
      - Card Requests
      operationId: get-card-request-details
      parameters:
      - name: cardRequestId
        in: path
        required: true
        description: The unique identifier of the card request.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/CardRequestDetail'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    delete:
      summary: Delete card request
      description: Cancel an existing card request
      tags:
      - Card Requests
      operationId: delete-card-request
      parameters:
      - name: cardRequestId
        required: true
        description: The unique identifier of the card request.
        in: path
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Ok
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /cards/requests/{cardRequestId}/approve:
    post:
      summary: Approve Card Request
      description: 'Approve a card request created by a cardholder. Optional body parameters can be used to override originally requested values.


        **This endpoint has changed in comparison to the previous version of the API.** The following changes were made:

        - changed the HTTP response code to 202 Accepted and removed the response body, to reflect the asynchronous nature of this endpoint'
      tags:
      - Card Requests
      operationId: approve-card-request
      parameters:
      - name: cardRequestId
        in: path
        required: true
        description: The unique identifier of the card request.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - approvedBy
                properties:
                  approvedBy:
                    type: string
                    format: uuid
                  approvedTransactionLimit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  approvedMonthlyLimit:
                    type: object
                    deprecated: true
                    description: Use `approvedLimit` instead.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  approvedLimit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  limitRenewFrequency:
                    type: string
                    enum:
                    - DAILY
                    - WEEKLY
                    - MONTHLY
                    - QUARTERLY
                    - ANNUAL
                    - TOTAL
                    description: '* `DAILY` - The card limit is renewed every day

                      * `WEEKLY` - The card limit is renewed every week

                      * `MONTHLY` - The card limit is renewed every calendar month

                      * `QUARTERLY` - The card limit is renewed every calendar quarter

                      * `ANNUAL` - The card limit is renewed every year

                      * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

                      '
                  approvedValidityPeriod:
                    type: integer
                    description: validity period of card up to 36 months
                  label:
                    type:
                    - string
                    - 'null'
                    description: Available only for virtual cards with a `cardConfig` containing `VIRTUAL` or `TRAVEL`. The maximum length is 40 characters.
                    maxLength: 40
                  comment:
                    type: string
                    minLength: 0
                    maxLength: 200
                  cardControls:
                    $ref: '#/components/schemas/CardControls'
      responses:
        '202':
          description: Accepted. The request was successful, please wait until the callback is triggered, since this is an asynchronous operation.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/CardRequestApprove'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /cards/requests/{cardRequestId}/reject:
    post:
      summary: Reject Card Request
      description: Reject a card request for a specific cardholder
      tags:
      - Card Requests
      operationId: reject-card-request
      parameters:
      - name: cardRequestId
        in: path
        required: true
        description: The unique identifier of the card request.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - rejectedBy
                properties:
                  rejectedBy:
                    type: string
                    format: uuid
      responses:
        '204':
          description: Ok
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
components:
  schemas:
    Error:
      type: object
      properties:
        errorCode:
          type: string
          description: The error code
        exceptionId:
          type: string
          format: uuid
          description: The id of the exception that was thrown
        message:
          type: string
          description: The cause of the error or further explanations on the error
    CardRequest:
      type: object
      required:
      - cardRequestId
      - organizationId
      - cardholderId
      properties:
        cardRequestId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        cardAccountId:
          type: string
          format: uuid
        cardholderId:
          type: string
          format: uuid
        type:
          type:
          - string
          - 'null'
          deprecated: true
          description: 'Deprecated, please use `cardConfig` instead.

            `BLACK` - Physical black premium credit card

            `PHYSICAL` - Physical credit card

            `VIRTUAL` - Virtual credit card

            `SINGLE_USE` - One-time virtual credit card (only one authorization allowed per card)

            `TRAVEL` - Virtual cards used specifically in travel industry related use cases

            '
          enum:
          - BLACK
          - PHYSICAL
          - VIRTUAL
          - SINGLE_USE
          - TRAVEL
        status:
          type: string
          enum:
          - APPROVED
          - REJECTED
          - PENDING
          - CANCELED
        cardConfig:
          type: string
          description: Please contact your Pliant contact person for details
    CardRequestCallback:
      type: object
      required:
      - organizationId
      - cardholderId
      - cardRequestId
      - requestedLimit
      - requestedLimitRenewFrequency
      - requestedTransactionLimit
      properties:
        organizationId:
          type: string
          format: uuid
          description: The id of the organization.
        cardAccountId:
          type: string
          format: uuid
          description: The id of the card account.
        cardholderId:
          type: string
          format: uuid
          description: The id of the cardholder.
        cardRequestId:
          type: string
          format: uuid
          description: The id of the card request.
        cardId:
          type: string
          format: uuid
          description: The id of the card which is requested (approved / rejected). Depending if the request gets approved or not, the card data and status may vary.
        requestedLimit:
          type: object
          description: The requested card limit.
          properties:
            value:
              type: number
              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
            currency:
              type: string
              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
        requestedLimitRenewFrequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - QUARTERLY
          - ANNUAL
          - TOTAL
          description: '* `DAILY` - The card limit is renewed every day

            * `WEEKLY` - The card limit is renewed every week

            * `MONTHLY` - The card limit is renewed every calendar month

            * `QUARTERLY` - The card limit is renewed every calendar quarter

            * `ANNUAL` - The card limit is renewed every year

            * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

            '
        requestedTransactionLimit:
          type: object
          properties:
            value:
              type: number
              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
            currency:
              type: string
              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
        comment:
          type: string
          minLength: 0
          maxLength: 200
        isBenefit:
          type:
          - boolean
          - 'null'
          description: Indicates that the card was issued as an employee benefit.
        fundingType:
          type: string
          description: '* `CHARGE` - normal (non-benefit) credit card

            * `LOAD_BASED_ACCRUING` - benefit card where money not spent is transferred to the next month

            * `LOAD_BASED_NON_ACCRUING` - benefit card where money not spent is lost end of month

            * `BALANCE_BASED` - benefit card with a standing balance that persists across months and is spent down until depleted (no monthly reset).

            '
          enum:
          - CHARGE
          - LOAD_BASED_ACCRUING
          - LOAD_BASED_NON_ACCRUING
          - BALANCE_BASED
        nextLoadDate:
          type:
          - string
          - 'null'
          format: date
          description: For cards that are loaded periodically, indicates the date when the card will be loaded the next time.
    CardRequestDetail:
      type: object
      required:
      - cardRequestId
      - organizationId
      - cardholderId
      - validityPeriod
      - requestedTransactionLimit
      - requestedLimit
      - comment
      properties:
        cardRequestId:
          type: string
          format: uuid
          description: The id of the card request.
        organizationId:
          type: string
          format: uuid
          description: The id of the organization.
        cardAccountId:
          type: string
          format: uuid
          description: The id of the card account.
        cardholderId:
          type: string
          format: uuid
          description: The id of the cardholder.
        type:
          type:
          - string
          - 'null'
          deprecated: true
          enum:
          - VIRTUAL
          - SINGLE_USE
          - PHYSICAL
          - BLACK
          - TRAVEL
          description: "Deprecated, please use `cardConfig` instead.\n`VIRTUAL` - Virtual credit card\n`SINGLE_USE` - One-time virtual credit card (only one authorization allowed per card)  \n`PHYSICAL` - Physical credit card\n`BLACK` - Physical black premium credit card\n`TRAVEL` - Virtual cards used specifically in travel industry related use cases\n"
        cardConfig:
          type: string
