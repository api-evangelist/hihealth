          maximum: 999999999
          description: Optional field to describe the maximum number of transactions within the range of `1..999999999` that can be performed with this card. If not provided, the card can be used for an unlimited number of transactions until the card expires.
        fundingType:
          type: string
          description: '* `CHARGE` - normal (non-benefit) credit card

            * `LOAD_BASED_ACCRUING` - benefit card where money not spent is transferred to the next month

            * `LOAD_BASED_NON_ACCRUING` - benefit card where money not spent is lost end of month

            * `BALANCE_BASED` - benefit card with a standing balance that persists across months and is spent down until depleted (no monthly reset).

            '
          enum:
          - CHARGE
          - LOAD_BASED_ACCRUING
          - LOAD_BASED_NON_ACCRUING
          - BALANCE_BASED
        clickToPayInfo:
          type:
