        additionalLimits:
          type: array
          description: Additional limits on this card. Empty when none are configured. Re-fetch or subscribe to `CARD_LIMITS_CHANGED` to get the latest state after a limit change.
          items:
            type: object
            description: An additional limit applied to this card.
            properties:
              id:
                type: string
                format: uuid
                description: The unique identifier of this additional limit. Use this `id` when updating or removing the limit via `PUT /api/cards/limits/{cardId}`.
              limitRenewFrequency:
                type: string
                enum:
                - PER_TRANSACTION
                - DAILY
                - WEEKLY
                - MONTHLY
                - QUARTERLY
                - ANNUAL
                - TOTAL
                description: 'The renewal frequency of this additional limit. `PER_TRANSACTION` is only valid for additional limits, not for the card''s primary limit.

                  * `PER_TRANSACTION` - Limit applies to each individual transaction.

                  * `DAILY` - The limit is renewed every day.

                  * `WEEKLY` - The limit is renewed every week.

                  * `MONTHLY` - The limit is renewed every calendar month.

                  * `QUARTERLY` - The limit is renewed every calendar quarter.

                  * `ANNUAL` - The limit is renewed every year.

                  * `TOTAL` - The limit is never renewed. Once spent, no further transactions are allowed under this limit.

                  '
              limit:
                type: object
                description: The monetary cap for this additional limit.
                properties:
                  value:
                    type: number
                    description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                  currency:
                    type: string
                    description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
              maxTransactionCount:
                type:
                - number
                - 'null'
                minimum: 1
                maximum: 999999999
                description: Maximum number of transactions allowed under this additional limit within its renewal period. Null if no transaction-count cap is configured.
              scope:
                type:
                - object
                - 'null'
                description: The scope restriction of this additional limit. Null when no scope is defined (`categories` and `acceptanceMethods` empty, `atmWithdrawal` false, `currency` null).
                properties:
                  categories:
                    type: array
                    description: Merchant category types this limit applies to. Empty when no category restriction is set.
                    items:
                      type: string
                      enum:
                      - ADVERTISING_AND_MARKETING
                      - COMPUTING_AND_SOFTWARE
                      - EDUCATION_AND_TRAINING
                      - ELECTRONICS_AND_IT_EQUIPMENT
                      - ENTERTAINMENT_AND_WELLNESS
                      - FOOD_AND_DRINKS
                      - GIFTS_AND_VOUCHERS
                      - HEALTHCARE
                      - MATERIALS_AND_PACKAGING
                      - OFFICE_SUPPLIES_AND_EQUIPMENT
                      - SERVICES
                      - TRAVEL_AND_ACCOMMODATION
                      - OTHER
                  acceptanceMethods:
                    type: array
                    description: The card acceptance methods this limit applies to. Empty when no acceptance-method restriction is set.
                    items:
                      type: string
                      enum:
                      - ONLINE
                      - MOBILE_WALLET
                      - MANUAL_ENTRY
                      - CONTACTLESS
                      - CHIP_DIP
                      - NOT_AVAILABLE
                      - MAGNETIC_STRIPE
                      - OTHER
                  atmWithdrawal:
                    type: boolean
                    description: When `true`, this additional limit applies to ATM withdrawal transactions.
                  currency:
                    type:
