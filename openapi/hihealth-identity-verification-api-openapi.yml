tags:
- name: Identity Verification
  description: This tag is for operations related to identity verification
paths:
  /identity-verification:
    get:
      summary: List Identity Verifications
      description: Returns all identity verifications for a given member or representative.
      tags:
      - Identity Verification
      operationId: list-identity-verifications
      parameters:
      - name: referenceType
        in: query
        required: true
        description: The type of the referenced entity.
        schema:
          type: string
          enum:
          - MEMBER
          - REPRESENTATIVE
      - name: referenceId
        in: query
        required: true
        description: The unique identifier of the member or representative.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/paths/~1identity-verification/post/responses/200/content/application~1json/schema'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    post:
      summary: Start Identity Verification
      description: Initiates an identity verification process for a member or representative.
      tags:
      - Identity Verification
      operationId: start-identity-verification
      parameters:
      - name: referenceType
        in: query
        required: true
        description: The type of the referenced entity.
        schema:
          type: string
          enum:
          - MEMBER
          - REPRESENTATIVE
      - name: referenceId
        in: query
        required: true
        description: The unique identifier of the member or representative.
        schema:
          type: string
          format: uuid
      - name: identificationType
        in: query
        required: true
        description: The identification provider type to use.
        schema:
          type: string
          enum:
          - IDNOW_VG_VIDEOIDENT
          - IDNOW_PLIANT_OY_AUTOIDENT
          - IDNOW_PLIANT_OY_VIDEOIDENT
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique identifier of the identity verification.
                  type:
                    type: string
                    description: Identification provider type.
                    enum:
                    - IDNOW_VG_VIDEOIDENT
                    - IDNOW_PLIANT_OY_AUTOIDENT
                    - IDNOW_PLIANT_OY_VIDEOIDENT
                  provider:
                    type: string
                    description: Identification provider.
                    enum:
                    - IDNOW
                  legitimationStatus:
                    type:
                    - string
                    - 'null'
                    description: 'Current status of the identity verification.

                      * `ONGOING` - Verification is in progress.

                      * `COMPLETED` - Verification has been completed successfully.

                      * `FRAUD` - Verification was flagged as fraudulent.

                      * `CANCELLED` - Verification was cancelled.

                      '
                    enum:
                    - ONGOING
                    - COMPLETED
                    - FRAUD
                    - CANCELLED
                  transactionId:
                    type:
                    - string
                    - 'null'
                    description: External transaction identifier from the identification provider.
                  transactionNumber:
                    type:
                    - string
                    - 'null'
                    description: External transaction number from the identification provider.
                  references:
                    type: array
                    description: Member or representative references linked to this verification.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        referenceId:
                          type: string
                          format: uuid
                          description: ID of the referenced member or representative.
                        referenceType:
                          type: string
                          enum:
                          - MEMBER
                          - REPRESENTATIVE
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                  salutation:
                    type:
                    - integer
                    - 'null'
                    description: Salutation code.
                  gender:
                    type:
                    - string
                    - 'null'
                    description: Gender.
                  givenName:
                    type:
                    - string
                    - 'null'
                    description: First name.
                  surName:
                    type:
                    - string
                    - 'null'
                    description: Last name.
                  email:
                    type:
                    - string
                    - 'null'
                    description: Email address.
                  mobileNumber:
                    type:
                    - string
                    - 'null'
                    description: Mobile phone number.
                  dateOfBirth:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Date of birth.
                  placeOfBirth:
                    type:
                    - string
                    - 'null'
                    description: Place of birth.
                  countryOfBirth:
                    type:
                    - string
                    - 'null'
                    description: Country of birth.
                  citizenships:
                    type:
                    - array
                    - 'null'
                    description: List of citizenship country codes.
                    items:
                      type: string
                  street:
                    type:
                    - string
                    - 'null'
                    description: Street address.
                  streetNumber:
                    type:
                    - string
                    - 'null'
                    description: Street number.
                  postalCode:
                    type:
                    - string
                    - 'null'
                    description: Postal code.
                  city:
                    type:
                    - string
                    - 'null'
                    description: City.
                  countryCode:
                    type:
                    - string
                    - 'null'
                    description: Country code.
                  legitimation:
                    type:
                    - object
                    - 'null'
                    description: Document legitimation details, populated after verification completion.
                    properties:
                      date:
                        type:
                        - string
                        - 'null'
                        format: date
                        description: Date of legitimation.
                      provider:
                        type:
                        - string
                        - 'null'
                        description: Legitimation provider code.
                      document:
                        type:
                        - string
                        - 'null'
                        description: Document type code.
                      identificationDocument:
                        type:
                        - object
                        - 'null'
                        properties:
                          issuanceDate:
                            type:
                            - string
                            - 'null'
                            format: date
                          issuingOffice:
                            type:
                            - string
                            - 'null'
                          documentId:
                            type:
                            - string
                            - 'null'
                          validityDate:
                            type:
                            - string
                            - 'null'
                            format: date
                  archiveHref:
                    type:
                    - string
                    - 'null'
                    description: URL to download the identification archive.
                  createdAt:
                    type: string
                    format: date-time
                    description: Timestamp when the verification was created.
                  updatedAt:
                    type: string
                    format: date-time
                    description: Timestamp when the verification was last updated.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /identity-verification/{identityVerificationId}/stop:
    post:
      summary: Stop Identity Verification
      description: Stops an ongoing identity verification process.
      tags:
      - Identity Verification
      operationId: stop-identity-verification
      parameters:
      - name: identityVerificationId
        in: path
        required: true
        description: The unique identifier of the identity verification to stop.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
components:
  schemas:
    Error:
      type: object
      properties:
        errorCode:
          type: string
          description: The error code
        exceptionId:
          type: string
          format: uuid
          description: The id of the exception that was thrown
        message:
          type: string
          description: The cause of the error or further explanations on the error
  responses:
    '429':
      description: Too Many Requests. The API consumer has sent too many requests in a given amount of time. Please check our [API guidelines](/docs/pliant-api-guidelines#api-rate-limits).
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Detailed description of the error and breached rate limit.
    '500':
      description: Internal Server Error. The request was not completed due to an internal error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: Unauthorized. The API consumer is not authorized to access the requested resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '422':
      description: Unprocessable Content. The request could not be completed due to contents of the request. The syntax of the request content was correct.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '400':
      description: Bad Request. The API consumer sent a malformed request which could not be processed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '403':
      description: Forbidden. The API consumer is not allowed to access the requested resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: Not Found. The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: This API uses oAuth2 with client credentials flow to [obtain the Bearer Token](/docs/authenticated-api-usage).
      bearerFormat: JWT
