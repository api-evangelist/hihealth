openapi: 3.2.0
info:
  contact:
    name: API Support
    email: support@getpliant.com
    url: https://www.getpliant.com
  title: Pliant Partner External Transfers API
  description: Pliant Partner API
  version: 2.1.0
  license:
    name: MIT
    url: https://opensource.org/license/MIT
servers:
- url: https://partner-api.getpliant.com/api
  description: Pliant Production Server
- url: https://sandbox.partner-api.getpliant.com/api
  description: Pliant Sandbox Server
- url: https://pci-api.getpliant.com
  description: PCI Vault Production Server
- url: https://pci-sandbox.partner-api.getpliant.com
  description: PCI Vault Sandbox Server
security:
- bearerAuth: []
tags:
- name: External Transfers
  description: This tag is for operations related to external transfers
paths:
  /external-transfers:
    get:
      summary: List External Transfers
      description: 'Query external transfers for a specific organization. External transfers are payments made to beneficiaries outside of your organization.


        You can filter transfers by various criteria including beneficiary, source card account, transfer method, status, and date ranges.'
      tags:
      - External Transfers
      operationId: get-external-transfers
      parameters:
      - name: organizationId
        in: query
        description: The organization for which the external transfers are requested.
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Page number. Starts from '0'.
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Client suggested limit to restrict the number of entries on a page.
        required: false
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/ExternalTransfer'
                      - type: object
                        properties:
                          createdBy:
                            type: string
                            description: The user who created the transfer.
                          beneficiaryName:
                            type: string
                            description: The name of the beneficiary.
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    post:
      summary: Create External Transfer
      description: 'Create a new external transfer for the specified organization.


        External transfers are payments made to beneficiaries outside of your organization. You must provide the beneficiary information, transfer amount, and transfer method. The transfer will initially be created in DRAFT status and can be modified until submitted for processing.'
      tags:
      - External Transfers
      operationId: create-external-transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalTransferCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalTransfer'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /external-transfers/subscription:
    post:
      summary: 'Callback: Add/Update'
      description: Subscribe to callbacks for this entity or change an existing callback.
      tags:
      - External Transfers
      operationId: create-external-transfer-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackUrl:
                  type: string
                  format: uri
                  example: https://myserver.com/send/callback/here
                  description: The URL to send the callback to. Must be a valid and reachable URL. We do some basic validation to ensure the URL is syntactically correct and reachable for Pliant. Only HTTPS URLs are supported.
                eventTypes:
                  type: array
                  description: The event types to subscribe to.
                  items:
                    type: string
                    enum:
                    - EXTERNAL_TRANSFER_CREATED
                    - EXTERNAL_TRANSFER_STATUS_CHANGED
                    - EXTERNAL_TRANSFER_DETAILS_UPDATED
              required:
              - callbackUrl
              - eventTypes
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      callbacks:
        externalTransferCreated:
          '{$request.body#/callbackUrl}':
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                $ref: '#/components/requestBodies/ExternalTransferCreatedCallback'
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
        externalTransferStatusChanged:
          '{$request.body#/callbackUrl}':
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                $ref: '#/components/requestBodies/ExternalTransferStatusChangedCallback'
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
        externalTransferDetailsUpdated:
          '{$request.body#/callbackUrl}':
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                $ref: '#/components/requestBodies/ExternalTransferDetailsUpdatedCallback'
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
    delete:
      summary: 'Callback: Remove'
      description: Remove a callback subscription for this entity.
      tags:
      - External Transfers
      operationId: remove-external-transfer-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventTypes:
                  type: array
                  description: The event types to unsubscribe from.
                  items:
                    type: string
                    enum:
                    - EXTERNAL_TRANSFER_CREATED
                    - EXTERNAL_TRANSFER_STATUS_CHANGED
                    - EXTERNAL_TRANSFER_DETAILS_UPDATED
              required:
              - eventTypes
      responses:
        '200':
          description: Ok
  /external-transfers/{externalTransferId}:
    get:
      summary: Get External Transfer Details
      description: Get detailed information about a specific external transfer.
      tags:
      - External Transfers
      operationId: get-external-transfer-details
      parameters:
      - name: externalTransferId
        in: path
        description: The unique identifier of the external transfer.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalTransfer'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    put:
      summary: Update External Transfer
      description: 'Update an existing external transfer. You can modify the transfer details including beneficiary, amount, transfer method, and other properties.


        Note that transfers can only be modified when they are in DRAFT status. Once submitted for processing, most fields become read-only.'
      tags:
      - External Transfers
      operationId: update-external-transfer
      parameters:
      - name: externalTransferId
        in: path
        description: The unique identifier of the external transfer.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalTransferUpdateRequest'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalTransfer'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /external-transfers/{externalTransferId}/status:
    patch:
      summary: Update External Transfer Status
      description: 'Update the status of an existing external transfer. This endpoint allows you to change the transfer status, for example to approve, reject, or mark as paid.


        The available status transitions depend on the current status of the transfer and your organization''s configuration.'
      tags:
      - External Transfers
      operationId: update-external-transfer-status
      parameters:
      - name: externalTransferId
        in: path
        description: The unique identifier of the external transfer.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalTransferStatusUpdateRequest'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalTransfer'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /external-transfers/{externalTransferId}/submission:
    post:
      summary: Submit External Transfer
      description: 'Submit an external transfer for processing. This endpoint moves the transfer from DRAFT status to the next stage in the workflow, typically NEEDS_APPROVAL or COMPLIANCE_CHECK depending on your organization''s configuration.


        Once submitted, the transfer can no longer be modified and will proceed through the approval and compliance workflow.'
      tags:
      - External Transfers
      operationId: submit-external-transfer
      parameters:
      - name: externalTransferId
        in: path
        description: The unique identifier of the external transfer to submit.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalTransfer'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
components:
  requestBodies:
    ExternalTransferCreatedCallback:
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Event'
            - $ref: '#/components/schemas/ExternalTransferCallback'
    ExternalTransferDetailsUpdatedCallback:
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Event'
            - $ref: '#/components/schemas/ExternalTransferCallback'
    ExternalTransferStatusChangedCallback:
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Event'
            - $ref: '#/components/schemas/ExternalTransferCallback'
  schemas:
    Error:
      type: object
      properties:
        errorCode:
          type: string
          description: The error code
        exceptionId:
          type: string
          format: uuid
          description: The id of the exception that was thrown
        message:
          type: string
          description: The cause of the error or further explanations on the error
    ExternalTransferCallback:
      type: object
      properties:
        eventType:
          type:
          - string
          - 'null'
          description: 'The type of event. Can be one of: `EXTERNAL_TRANSFER_CREATED`, `EXTERNAL_TRANSFER_STATUS_CHANGED`, or `EXTERNAL_TRANSFER_DETAILS_UPDATED`.

            '
        id:
          type: string
          format: uuid
          description: The unique identifier of the external transfer.
        organizationId:
          type: string
          format: uuid
          description: The organization to which the external transfer belongs.
        teamId:
          type:
          - string
          - 'null'
          format: uuid
          description: The team associated with the external transfer.
        memberId:
          type:
          - string
          - 'null'
          format: uuid
          description: The member who created the external transfer.
        beneficiaryId:
          type: string
          format: uuid
          description: The beneficiary who will receive the transfer.
        beneficiaryPaymentDetailId:
          type:
          - string
          - 'null'
          format: uuid
          description: The payment details for the beneficiary.
        sourceCardAccountId:
          type:
          - string
          - 'null'
          format: uuid
          description: The card account from which the transfer will be made.
        transferAmount:
          type:
          - object
          - 'null'
          description: The amount of the transfer.
          properties:
            value:
              type: number
              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
            currency:
              type: string
              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
        transferMethod:
          type:
          - string
          - 'null'
          enum:
          - SEPA_CREDIT_TRANSFER
          - INSTANT_CREDIT_TRANSFER
          description: "The transfer method for the external transfer. Whether it is present depends on the transfer currency:\n - `SEPA_CREDIT_TRANSFER`: Used for `EUR` transfers.\n - `INSTANT_CREDIT_TRANSFER`: Used for `SEK` and `DKK` transfers.\n\nFor all other supported currencies (`AED`, `CZK`, `HUF`, `NOK`, `PLN`, `RON`) this field is not set (null / omitted) because the rail is selected automatically.\n"
        status:
          type: string
          enum:
          - DRAFT
          - NEEDS_APPROVAL
          - APPROVED
          - COMPLIANCE_CHECK
          - COMPLIANCE_PASSED
          - COMPLIANCE_REVIEW
          - PAYMENT_IN_PROGRESS
          - PAID
          - FAILED
          description: 'The current status of the external transfer. It can be one of the following values:

            - `DRAFT`: Transfer is in draft state and can be modified

            - `NEEDS_APPROVAL`: Transfer requires approval before processing

            - `APPROVED`: Transfer has been approved and is ready for processing

            - `COMPLIANCE_CHECK`: Transfer is undergoing compliance checks

            - `COMPLIANCE_PASSED`: Transfer has passed compliance checks

            - `COMPLIANCE_REVIEW`: Transfer is under compliance review

            - `PAYMENT_IN_PROGRESS`: Transfer is currently being processed

            - `PAID`: Transfer has been successfully completed

            - `FAILED`: Transfer has failed

            '
        purpose:
          type:
          - string
          - 'null'
          description: The purpose or description of the transfer.
        invoiceNumber:
          type:
          - string
          - 'null'
          description: The invoice number associated with the transfer.
        invoiceDate:
          type:
          - string
          - 'null'
          format: date
          description: The date of the invoice.
        dueDate:
          type:
          - string
          - 'null'
          format: date
          description: The due date for the transfer.
        transferTime:
          type:
          - string
          - 'null'
          format: date-time
          description: The scheduled time for the transfer.
        approvedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the transfer was approved.
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the transfer was created.
    ExternalTransferCreateRequest:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
          description: The organization for which the external transfer is being created.
        teamId:
          type: string
          format: uuid
          description: The team associated with the external transfer.
        beneficiaryId:
          type: string
          format: uuid
          description: The beneficiary who will receive the transfer.
        beneficiaryPaymentDetailId:
          type: string
          format: uuid
          description: The payment details for the beneficiary.
        sourceCardAccountId:
          type: string
          format: uuid
          description: The card account from which the transfer will be made.
        transferAmount:
          type: object
          description: The amount of the transfer.
          properties:
            value:
              type: number
              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
            currency:
              type: string
              description: 'The currency of the monetary amount in ISO 4217 format. Same-currency transfers support the following currencies, with the following `transferMethod` rules:

                - `EUR`: `SEPA_CREDIT_TRANSFER`

                - `SEK`, `DKK`: `INSTANT_CREDIT_TRANSFER`

                - `AED`, `CZK`, `HUF`, `NOK`, `PLN`, `RON`: omit `transferMethod`

                '
        transferMethod:
          type: string
          enum:
          - SEPA_CREDIT_TRANSFER
          - INSTANT_CREDIT_TRANSFER
          description: 'The transfer method for the external transfer. Whether it is required depends on the transfer currency:

            - `SEPA_CREDIT_TRANSFER`: SEPA Standard Credit Transfer (SCT). Required for `EUR` transfers.

            - `INSTANT_CREDIT_TRANSFER`: SEPA Instant Credit Transfer. Required for `SEK` and `DKK` transfers.


            For all other supported currencies (`AED`, `CZK`, `HUF`, `NOK`, `PLN`, `RON`) this field must be omitted — the rail is selected automatically and sending a value is rejected.

            '
        purpose:
          type: string
          description: The purpose or description of the transfer.
        invoiceNumber:
          type: string
          description: The invoice number associated with the transfer.
        invoiceDate:
          type: string
          format: date
          description: The date of the invoice.
        dueDate:
          type: string
          format: date
          description: The due date for the transfer.
        transferTime:
          type: string
          format: date-time
          description: The scheduled time for the transfer.
        vopId:
          type: string
          format: uuid
          description: 'The unique identifier of a completed Verification of Payee (VoP) check. Required for `SEPA_CREDIT_TRANSFER` transfers in accordance with the Verification of Payee regulation.


            Obtain this value by calling `POST /vop/verification` before creating the transfer. The verification must have `status: ACTIVE` (valid for 60 minutes after creation).

            '
      required:
      - organizationId
      - beneficiaryId
    ExternalTransfer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the external transfer.
        organizationId:
          type: string
          format: uuid
          description: The organization to which the external transfer belongs.
        teamId:
          type: string
          format: uuid
          description: The team associated with the external transfer.
        memberId:
          type: string
          format: uuid
          description: The member who created the external transfer.
        beneficiaryId:
          type: string
          format: uuid
          description: The beneficiary who will receive the transfer.
        beneficiaryPaymentDetailId:
          type: string
          format: uuid
          description: The payment details for the beneficiary.
        sourceCardAccountId:
          type: string
          format: uuid
          description: The card account from which the transfer will be made.
        transferAmount:
          type: object
          description: The amount of the transfer.
          properties:
            value:
              type: number
              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
            currency:
              type: string
              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
        transferMethod:
          type: string
          enum:
          - SEPA_CREDIT_TRANSFER
          - INSTANT_CREDIT_TRANSFER
          description: "The transfer method for the external transfer. Whether it is present depends on the transfer currency:\n- `SEPA_CREDIT_TRANSFER`: Used for `EUR` transfers.\n- `INSTANT_CREDIT_TRANSFER`: Used for `SEK` and `DKK` transfers.\n\n      For all other supported currencies (`AED`, `CZK`, `HUF`, `NOK`, `PLN`, `RON`) this field is not set (null / omitted) because the rail is selected automatically.\n"
        status:
          type: string
          enum:
          - DRAFT
          - NEEDS_APPROVAL
          - APPROVED
          - COMPLIANCE_CHECK
          - COMPLIANCE_PASSED
