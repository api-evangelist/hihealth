              description: 'The outcome of the Verification of Payee (VoP). It can be one of the following values:

                - `MATCH`: The payee name fully matches the account holder.

                - `CLOSE_MATCH`: The payee name closely matches the account holder.

                - `NO_MATCH`: The payee name does not match the account holder.

                - `UNAVAILABLE`: Verification could not be performed.

